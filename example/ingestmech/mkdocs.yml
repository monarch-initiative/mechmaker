# Colors and light or dark mode: conf/site.yaml, which `just docs-build` and
# `just docs-serve` apply over the palette below.
#
# The documentation site, built with `just docs-build` and published by the
# docs workflow. The schema pages under docs/elements/ are generated by
# LinkML's gen-doc on every build; do not edit them. Edit the other pages in
# docs/ directly.
site_name: "IngestMech"
site_description: "IngestMech records the data ingests of the Monarch Initiative knowledge graph: the upstream sources each one reads, the files it fetches, the terms those sources are licensed under, and what it produces."
site_url: https://monarch-initiative.github.io/ingestmech/
repo_url: https://github.com/monarch-initiative/ingestmech
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.magiclink
  # Material loads Mermaid itself for these blocks; no plugin is needed.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - The domain: DOMAIN.md
  - Curation: CURATION.md
  - Records: records/index.html
  - Corpus: corpus.md
  - Schema:
      - Classes, slots and enums: elements/index.md
      - Record structure: structure.md
  - Workflows: WORKFLOWS.md

watch:
  - src/ingestmech/schema
