id: https://w3id.org/monarch-initiative/ingestmech
name: ingestmech
title: Monarch Ingest Knowledge Base
description: >-
  IngestMech records the data ingests of the Monarch Initiative knowledge graph: the upstream sources each one reads, the files it fetches, the terms those sources are licensed under, and what it produces.
license: CC-BY-4.0
see_also:
  - https://github.com/monarch-initiative/ingestmech

# One record is one Monarch ingest repository. docs/DOMAIN.md says what that
# means and where each section comes from. Records are first written by
# scripts/convert_monarch_ingests.py from the repositories' own files, then
# curated: the upstream sources' licenses and descriptions come from the
# sources themselves.

prefixes:
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  skos: http://www.w3.org/2004/02/skos/core#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  schema: http://schema.org/
  ingestmech: https://w3id.org/monarch-initiative/ingestmech/
  PMID: http://www.ncbi.nlm.nih.gov/pubmed/
  infores: https://w3id.org/information-resource-registry/
  biolink: https://w3id.org/biolink/vocab/
  DOI: https://doi.org/
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_

default_prefix: ingestmech
default_range: string

imports:
  - linkml:types
  - mech_shared

# ============================================================ classes

classes:

  Ingest:
    tree_root: true
    description: >-
      One Monarch ingest: a repository that downloads files from upstream
      sources and transforms them into Biolink associations with koza. One
      record lives in one YAML file under data/ingests/, named for the
      repository.
    slots:
      - id
      - name
      - description
      - description_evidence
      - status
      - repository
      - source_commit
      - code_license
      - upstream_sources
      - organisms
      - associations
      - koza_transforms
      - evidence
      - discussions
      - notes
      - creation_date
      - updated_date
      - curation_history
    slot_usage:
      id:
        description: >-
          ingestmech: and the repository name, e.g. ingestmech:omim-ingest.
        pattern: "^ingestmech:[A-Za-z0-9_.-]+$"
      name:
        required: true
        description: The repository name, e.g. omim-ingest.
      description:
        recommended: true

  Term:
    description: A reference to an ontology term. The label must match the ontology.
    slots:
      - id
      - label
    slot_usage:
      label:
        required: true

  Descriptor:
    abstract: true
    description: >-
      A curated mention of something, with a human-readable preferred term, an
      optional ontology binding, and evidence. The preferred term may be more
      specific than the bound term when the ontology lacks the needed
      granularity. Never bind a guessed CURIE; leave `term` empty instead.
    slots:
      - preferred_term
      - term
      - description
      - evidence
      - notes

  OrganismDescriptor:
    is_a: Descriptor
    description: An organism, bindable to NCBITaxon.
    slot_usage:
      term:
        bindings:
          - binds_value_of: id
            range: OrganismTerm
            obligation_level: REQUIRED

  UpstreamSource:
    description: >-
      A source the ingest downloads data from, named by its infores id where
      the Biolink information resource catalog has one.
    slots:
      - infores
      - name
      - description
      - homepage
      - access
      - data_license
      - files
      - evidence
      - notes
    slot_usage:
      name:
        required: true
        description: The source's name as the ingest gives it.
      description:
        description: What the source is, in the source's own terms, quoted in evidence.

  DataFile:
    description: One file the ingest downloads, from its download.yaml.
    slots:
      - download_url
      - local_name
      - evidence

  License:
    description: >-
      Terms a thing is available under. For upstream data, from the source's
      own terms of use, never assumed.
    slots:
      - name
      - spdx_id
      - url
      - evidence
      - notes
    slot_usage:
      name:
        required: true
        description: The license or terms as the source names them.

  AssociationOutput:
    description: A kind of Biolink association the ingest writes.
    slots:
      - category
      - predicates
      - description
      - evidence

  EvidenceItem:
    description: >-
      A citation that bears on a claim, with a verbatim quote from the source.
      The quote is checked against the cached source text by
      linkml-reference-validator. A paraphrase fails.
    slots:
      - reference
      - reference_title
      - supports
      - evidence_source
      - snippet
      - explanation

  CurationEvent:
    description: >-
      One change to this record, appended and never edited. The repository
      level history/ layer records the session; this records the change on the
      record itself.
    slots:
      - timestamp
      - curator
      - llm_assisted
      - model
      - action
      - description

# ============================================================ slots

slots:
  id:
    identifier: true
    range: uriorcurie
    description: A CURIE.
  name:
    slot_uri: schema:name
    description: Preferred human-readable name.
  label:
    slot_uri: rdfs:label
    description: >-
      The ontology's own label for the term. Checked by linkml-term-validator.
  description:
    slot_uri: dcterms:description
    description: Free-text description.
  notes:
    description: Curator notes. Paraphrase belongs here, never in a snippet.
  synonyms:
    slot_uri: skos:altLabel
    multivalued: true
    description: Other names in use.
  status:
    range: CurationStatusEnum
    description: Review state. An agent-drafted record is PROPOSED, never REVIEWED.
  preferred_term:
    required: true
    description: The preferred human-readable term for this descriptor.
  term:
    range: Term
    inlined: true
    recommended: true
    description: Ontology term binding. Leave empty rather than guess.
  organisms:
    range: OrganismDescriptor
    multivalued: true
    inlined_as_list: true
    description: >-
      Species whose data the ingest takes. Leave out when the ingest does not
      say; a gene-disease source for one species still names it.
  repository:
    range: uri
    required: true
    description: The ingest's GitHub repository.
  source_commit:
    pattern: "^[0-9a-f]{40}$"
    description: >-
      The repository commit the record was converted from. Evidence quoting
      the repository's files is pinned to it.
  code_license:
    range: License
    inlined: true
    description: License of the ingest's own code, from its repository.
  upstream_sources:
    range: UpstreamSource
    multivalued: true
    inlined_as_list: true
    description: The sources the ingest downloads from, as its src/versions.py names them.
  infores:
    pattern: "^infores:[a-z0-9][a-z0-9_.-]*$"
    description: >-
      The source's id in the Biolink information resource catalog. Left out,
      with a CURATION_TODO, when the ingest's id is not in the catalog.
  homepage:
    range: uri
    description: The source's home page.
  access:
    range: AccessEnum
    description: What it takes to download the source's files.
  data_license:
    range: License
    inlined: true
    description: Terms the source's data is available under.
  files:
    range: DataFile
    multivalued: true
    inlined_as_list: true
    description: The files the ingest downloads from this source.
  url:
    range: uri
    description: Where the thing is.
  download_url:
    required: true
    description: >-
      The URL as download.yaml gives it. It may hold a placeholder in braces,
      such as {MONARCH_OMIM_DOWNLOAD_KEY}, for a key the ingest fills in, so
      it is kept as text rather than checked as a URI.
  local_name:
    description: Where the ingest saves the file, relative to the repository.
  spdx_id:
    title: SPDX id
    pattern: "^[A-Za-z0-9.+-]+$"
    description: SPDX license identifier, when the terms are an SPDX license.
  associations:
    range: AssociationOutput
    multivalued: true
    inlined_as_list: true
    description: The Biolink association classes the ingest writes.
  category:
    pattern: "^biolink:[A-Z][A-Za-z]+$"
    required: true
    description: A Biolink class, e.g. biolink:CausalGeneToDiseaseAssociation.
  predicates:
    multivalued: true
    pattern: "^biolink:[a-z_]+$"
    description: Biolink predicates used on this class of association.
  koza_transforms:
    multivalued: true
    description: Names of the ingest's koza transforms, from the `name` of each src/*.yaml.
  evidence:
    range: EvidenceItem
    multivalued: true
    inlined_as_list: true
    recommended: true
    description: Citations that bear on the enclosing claim.
  description_evidence:
    range: EvidenceItem
    multivalued: true
    inlined_as_list: true
    recommended: true
    description: >-
      Quotes for the facts stated in the record's description. Every fact
      there needs one, here or in the section that states it with evidence.
  discussions:
    range: Discussion
    multivalued: true
    inlined_as_list: true
    description: Open questions, knowledge gaps and curation to-dos (mech_shared).
  reference:
    description: The cited source, as a CURIE such as PMID:12345678 or DOI:10.1000/xyz.
    pattern: "^[A-Za-z][A-Za-z0-9_]*:[^\\s]+$"
    required: true
    implements:
      - linkml:authoritative_reference
  reference_title:
    description: Title of the cited source. Filled by tooling.
    recommended: true
  supports:
    range: EvidenceSupportEnum
    required: true
    description: Which way the evidence cuts relative to the claim.
  evidence_source:
    range: EvidenceSourceEnum
    description: The kind of system the evidence comes from.
  snippet:
    description: >-
      An exact quote from the cited source. Checked verbatim against the cached
      source text. Paraphrase goes in `explanation`.
    implements:
      - linkml:excerpt
  explanation:
    description: How the quote bears on the claim.
  creation_date:
    range: date
    description: Date the record was created. Stable after first set.
  updated_date:
    range: date
    description: Date of the last substantive change.
  curation_history:
    range: CurationEvent
    multivalued: true
    inlined_as_list: true
    description: Append-only list of changes to this record.
  timestamp:
    range: datetime
    required: true
    description: ISO-8601 time of the change.
  curator:
    required: true
    description: GitHub login of the person, or harness name of the agent.
  llm_assisted:
    range: boolean
    description: True when a model produced or edited the content.
  model:
    description: Model identifier when llm_assisted is true.
  action:
    range: CurationActionEnum
    required: true
    description: What kind of change this was.

# ============================================================ enums

enums:
  CurationStatusEnum:
    description: Review state of a record.
    permissible_values:
      DRAFT:
        description: Incomplete. Not ready for review.
      PROPOSED:
        description: Complete and validated, awaiting human review.
      REVIEWED:
        description: A person reviewed and accepted it. Only a person sets this.
      DEPRECATED:
        description: Kept for provenance. Not current.

  EvidenceSupportEnum:
    description: Direction of an evidence item relative to its claim.
    permissible_values:
      SUPPORT:
        description: The source supports the claim.
      REFUTE:
        description: The source contradicts the claim.
      PARTIAL:
        description: The source supports the claim in part or with caveats.
      NO_EVIDENCE:
        description: The source is relevant but does not bear on the claim.
      WRONG_STATEMENT:
        description: The cited statement was found to be wrong. Kept for provenance.

  EvidenceSourceEnum:
    description: Where the evidence comes from.
    permissible_values:
      INGEST_REPOSITORY:
        description: A file in the ingest's own repository, pinned to a commit.
      SOURCE_DOCUMENTATION:
        description: The upstream source's own pages or documentation.
      REGISTRY:
        description: A registry of sources, such as the Biolink information resource catalog.
      PUBLICATION:
        description: A paper describing the source.
      OTHER:

  AccessEnum:
    description: What it takes to download a source's files.
    permissible_values:
      OPEN:
        description: Anyone can download the files, with no account or key.
      REGISTRATION_REQUIRED:
        description: The files need an account, a key or an agreement.

  CurationActionEnum:
    description: Kind of change recorded in a CurationEvent.
    permissible_values:
      CREATE:
      EDIT:
      REVIEW:
      DEPRECATE:

  OrganismTerm:
    description: An organism term, descending from NCBITaxon:1 (root).
    reachable_from:
      source_nodes:
        - NCBITaxon:1  # root
      is_direct: false
      include_self: true
      relationship_types:
        - rdfs:subClassOf
