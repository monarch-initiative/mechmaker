id: datmech:48502
name: 48502 Flint, Michigan
description: 'ZIP code 48502 is in Flint, Michigan, on the Flint River. Flint buys its drinking water from the Great Lakes Water Authority, which draws it from Lake Huron. From April 2014 to October 2015 the city treated Flint River water instead, and lead from its pipes leached into the supply: the Flint water crisis.'
description_evidence:
  - reference: url:https://www.epa.gov/flint/flint-drinking-water-faqs
    reference_title: Flint Drinking Water FAQs | US EPA
    supports: SUPPORT
    evidence_source: GOVERNMENT_RECORD
    snippet: The primary supplier of drinking water is The Great Lakes Water Authority in Detroit and the secondary supplier of drinking water is Genesee County.
  - reference: url:https://www.cityofflint.com/progress-report-on-flint-water-secondary-water-pipeline/
    reference_title: Progress Report on Flint Water - City of Flint
    supports: SUPPORT
    evidence_source: UTILITY_RECORD
    snippet: Both the Genesee County Drain Commission and GLWA source their water from Lake Huron.
  - reference: WIKIPEDIA:Flint_water_crisis
    reference_title: Flint water crisis
    supports: SUPPORT
    evidence_source: ENCYCLOPEDIA
    snippet: In April 2014, during a financial crisis, state-appointed emergency manager Darnell Earley changed Flint's water source from the Detroit Water and Sewerage Department (sourced from Lake Huron and the Detroit River) to the Flint River.
  - reference: WIKIPEDIA:Flint_water_crisis
    reference_title: Flint water crisis
    supports: SUPPORT
    evidence_source: ENCYCLOPEDIA
    snippet: The city switched back to the Detroit water system on October 16, 2015.
