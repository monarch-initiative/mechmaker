# Colors and light or dark mode: conf/site.yaml, which `just docs-build` and
# `just docs-serve` apply over the palette below.
#
# The documentation site, built with `just docs-build` and published by the
# docs workflow. The schema pages under docs/elements/ are generated by
# LinkML's gen-doc on every build; do not edit them. Edit the other pages in
# docs/ directly.
site_name: "DaTMech"
site_description: "DaTMech records US ZIP code areas by their water: the watersheds they drain to, the plants that treat their drinking water and wastewater, and the incidents that have harmed its safety or quality, with every claim quoted from its source."
# DaTMech is an example inside mechmaker, published with mechmaker's site.
site_url: https://monarch-initiative.github.io/mechmaker/example/datmech/
repo_url: https://github.com/monarch-initiative/mechmaker
edit_uri: edit/main/example/datmech/docs/

theme:
  name: material
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.magiclink
  # Material loads Mermaid itself for these blocks; no plugin is needed.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - The domain: DOMAIN.md
  - Curation: CURATION.md
  - Records: records/index.html
  - Corpus: corpus.md
  - Schema:
      - Classes, slots and enums: elements/index.md
      - Record structure: structure.md
  - Workflows: WORKFLOWS.md

watch:
  - src/datmech/schema
