[project]
name = "mechmaker"
version = "0.1.4"
description = "A Copier template and agent skills for making Mechs."
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "copier>=9.8",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "actionlint-py>=1.7",
    "shellcheck-py>=0.10",
    # This documentation site. MkDocs 2 drops the plugin and theme system
    # Material relies on, so stay on 1.x.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: installs a generated Mech and runs its gates (network)"]

[tool.ruff]
line-length = 110
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
