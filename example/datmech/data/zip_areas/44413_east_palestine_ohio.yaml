incidents:
  - name: East Palestine train derailment
    incident_kind: SPILL
    start_date: '2023-02-03'
    description: A Norfolk Southern freight train carrying hazardous materials derailed; spilled chemicals reached Sulphur Run and Leslie Run and were detected downstream to the Ohio River. Drinking water and supply wells have been tested since, and groundwater, surface water and drinking water are sampled quarterly.
    cause: A freight train derailment; twenty cars carried hazardous materials.
    processes:
      - preferred_term: chemical spill into streams
        term:
          id: ENVO:02500039
          label: water pollution
        evidence:
          - reference: WIKIPEDIA:East_Palestine,_Ohio,_train_derailment
            reference_title: East Palestine, Ohio, train derailment
            supports: SUPPORT
            evidence_source: ENCYCLOPEDIA
            snippet: On February 4, they noticed water spillage into Sulphur Run and Leslie Run, and installed booms and underflow dams to separate the floating pollutant.
    contaminants:
      - preferred_term: vinyl chloride
        term:
          id: CHEBI:28509
          label: chloroethene
        evidence:
          - reference: PMID:39344962
            reference_title: Natural Attenuation Potential of Vinyl Chloride and Butyl Acrylate Released in the East Palestine, Ohio Train Derailment Accident.
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: Streambed sediment, surface water, and private well water samples were collected 128 and 276 days postaccident to assess the natural attenuation potential of VC and BA
      - preferred_term: butyl acrylate
        term:
          id: CHEBI:3245
          label: butyl acrylate
        evidence:
          - reference: PMID:39344962
            reference_title: Natural Attenuation Potential of Vinyl Chloride and Butyl Acrylate Released in the East Palestine, Ohio Train Derailment Accident.
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: The results indicate that microbiomes in the East Palestine watershed have natural attenuation capacity for VC and BA.
    affected_waters:
      - preferred_term: Sulphur Run
        term: *id001
        evidence:
          - &id002
            reference: WIKIPEDIA:East_Palestine,_Ohio,_train_derailment
            reference_title: East Palestine, Ohio, train derailment
            supports: SUPPORT
            evidence_source: ENCYCLOPEDIA
            snippet: Material from the crash was observed in storm drains and detected in samples from Sulphur Run, Leslie Run, Bull Creek, North Fork Little Beaver Creek, Little Beaver Creek, and the Ohio River.
      - preferred_term: Leslie Run
        term: *id001
        evidence:
          - *id002
      - preferred_term: Bull Creek
        term: *id001
        evidence:
          - *id002
      - preferred_term: North Fork Little Beaver Creek
        term: *id001
        evidence:
          - *id002
      - preferred_term: Little Beaver Creek
        term: *id001
        evidence:
          - *id002
      - preferred_term: Ohio River
        term:
          id: ENVO:00000022
          label: river
        evidence:
          - *id002
    evidence:
      - reference: url:https://www.epa.gov/east-palestine-oh-train-derailment
        reference_title: East Palestine, Ohio Train Derailment | US EPA
        supports: SUPPORT
        evidence_source: GOVERNMENT_RECORD
        snippet: Twenty of the affected cars contained hazardous materials, including vinyl chloride, ethylene glycol, ethylhexyl acrylate, butyl acrylate and isobutylene.
      - reference: WIKIPEDIA:East_Palestine,_Ohio,_train_derailment
        reference_title: East Palestine, Ohio, train derailment
        supports: SUPPORT
        evidence_source: ENCYCLOPEDIA
        snippet: conducted a controlled release and burn of the five tanks of vinyl chloride into the air.
      - reference: WIKIPEDIA:East_Palestine,_Ohio,_train_derailment
        reference_title: East Palestine, Ohio, train derailment
        supports: SUPPORT
        evidence_source: ENCYCLOPEDIA
        snippet: A later estimate put the number of minnows at 38,222, with other species of animals at 5,500, totaling 43,222.
        explanation: The fish kill in the streams.
      - reference: url:https://www.epa.gov/east-palestine-oh-train-derailment/did-drinking-water-samples-american-legion-east-palestine-have
        reference_title: Did drinking water samples from the American Legion in East Palestine have detections of vinyl chloride? | US EPA
        supports: SUPPORT
        evidence_source: GOVERNMENT_RECORD
        snippet: has been tested weekly since the incident and vinyl chloride has not been detected in the drinking water, nor any of the water supply wells.
      - reference: url:https://www.epa.gov/east-palestine-oh-train-derailment
        reference_title: East Palestine, Ohio Train Derailment | US EPA
        supports: SUPPORT
        evidence_source: GOVERNMENT_RECORD
        snippet: Groundwater, surface water, and drinking water are sampled quarterly as part of the site’s long-term monitoring.
    notes: Contaminants lists the two chemicals sampled in the watershed's water (PMID:39344962). The cars also carried ethylene glycol, ethylhexyl acrylate and isobutylene (US EPA).
discussions:
  - discussion_id: east-palestine-bottled-water-advice
    prompt: Were residents advised to drink bottled water after the derailment, by whom, and until when?
    kind: KNOWLEDGE_GAP
    status: OPEN
    attaches_to:
      - incidents
    rationale: News reports say residents were urged to drink bottled water until test results came in, that Ohio EPA declared the village water safe around February 15, 2023, and that the governor advised private well users on February 17 to keep using bottled water until their wells were tested. The state's own pages for those updates answered 404 on 2026-10-09, so no advisory is recorded. Sourced, it would make curation_priority HIGH.
  - discussion_id: east-palestine-private-wells
    prompt: Record the private wells in the ZIP area, which the village system does not serve.
    kind: CURATION_TODO
    status: OPEN
    attaches_to:
      - treatment_facilities
    rationale: US EPA says the Columbiana County Health District tests private wells; how many households in the area rely on them is not yet sourced.
