# What a Mech must do when it takes a template change, beyond taking files.
#
# The sync-mech skill shows each note to a Mech whose update reaches it. Add
# one in the same pull request as any change that existing Mechs must act on
# by hand: records to migrate, a field renamed or newly required, a file to
# stop tracking, a command renamed. A change that only edits template files
# needs no note; Copier carries it.
#
#   id:      stable and unique; never reuse one
#   pr:      the pull request that made the change. The note reaches a Mech
#            when that pull request is among its updates. Without pr, it
#            reaches a Mech when the note is new since the Mech's commit.
#   when:    optional: an answer that must be set (not false or empty)
#   summary: one line, for the person choosing updates
#   action:  what the agent does, step by step. Say how to tell whether the
#            Mech needs it at all.
#
# Oldest first.

- id: untrack-pages
  pr: 53
  when: include_site
  summary: pages/ is no longer committed; the docs build renders the record browser.
  action: |
    If `git ls-files pages` lists anything, run `git rm -r --cached pages`
    and commit. The new .gitignore keeps it out after that.

- id: record-term-for-ontology-ids
  pr: 55
  when: identity_prefix
  summary: A record whose id is an ontology term must name the same term in record_term.
  action: |
    Run `just qc`. Each record it reports with "record_term must name it"
    needs `record_term: {id: <the record's id>, label: <the ontology's
    label>}`. Look the label up with `just term-info <PREFIX> <id>`; never
    type it from memory. A designed schema that dropped or renamed `record_term`
    needs the slot back first (`extend-schema`).

- id: minted-uuid-ids
  pr: 65
  summary: New records without an ontology term get a minted id, <slug>:<uuid>, not one made from the name.
  action: |
    Nothing to migrate. Existing ids stay as they are: an id never changes
    once published, so do not rewrite name-style ids to uuids. If the
    Mech's own docs or prompts tell curators to make ids from names, point
    them at `just new-record` without --id instead.

- id: identity-adapter-wins
  pr: 63
  when: identity_prefix
  summary: identity_adapter now serves every term with the identity prefix, including an extra ontology that names its own adapter.
  action: |
    Look in `.copier-answers.yml` for an `extra_ontologies` item whose
    prefix is the identity prefix and that sets its own `adapter`. If there
    is none, nothing to do. If there is, `conf/oak_config.yaml` now sends
    that prefix to `identity_adapter`: check that it serves the terms (run
    `just qc`), then drop the item's `adapter`, or set `identity_adapter` to
    it with `copier update --vcs-ref=:current: --data identity_adapter=<adapter>`. Copier now
    refuses the old pair when it asks the question again.

- id: copier-9-8-current-ref
  pr: 77
  summary: Changing an answer now uses `copier update --vcs-ref=:current:`, which needs Copier 9.8.0 or newer.
  action: |
    Run `copier --version` if Copier is installed as a tool (`uvx copier`
    always fetches a current one). Older than 9.8.0: `uv tool upgrade
    copier`; the template now refuses older versions. Then search the
    Mech's own docs, skills and prompts for `copier update` with `--data`
    and no `--vcs-ref`. Add `--vcs-ref=:current:` to each, so changing an
    answer keeps the Mech at its template commit. Files taken from the
    template already have it.

- id: curation-queue-trusts-less
  pr: 78
  summary: literature-scan issues no longer carry `curation`; the curation queue trusts only the Mech's own Apps and withholds text edited after the label.
  action: |
    Look in `.copier-answers.yml` for `curation-scanner` under `workflows`.
    If it is not there, nothing to do. If it is:
    1. With `literature-scan` on too, list open issues labelled both
       `literature` and `curation` (`gh issue list --label literature
       --label curation --state open`). Show them to the person: each one
       went to the scanner without anyone reading it. Remove `curation`
       from the ones they have not read; they add it back after reading.
    2. The queue now keeps comments only from people with write access and
       from the agent and reviewer Apps. If the Mech relies on another
       App's comments reaching the scanner, tell the person they are now
       left out. `github-actions[bot]` comments are left out too; its
       reviews are kept only when the review workflow posted them.
    3. If the Mech edited `.github/prompts/compliance.md`, replace its
       `gh pr list` step with reading `.compliance-open.txt`, as the
       template's prompt does: the agent no longer has `gh pr list`.

- id: version-from-tag
  pr: 79
  summary: The package version now comes from the latest v1.2.3 git tag; pyproject.toml no longer holds one.
  action: |
    Look in `pyproject.toml`: if it has `dynamic = ["version"]` and no
    `version =` line, the update merged cleanly. If a merge left a
    `version = "..."` line beside `dynamic`, delete the `version` line.
    Nothing else to migrate. If the Mech publishes to PyPI (it has
    `.github/workflows/pypi-publish.yaml`), check the versions it already
    holds: the next tag must be higher than any of them, and from now on
    a release is a new tag, not an edit to `pyproject.toml`.
