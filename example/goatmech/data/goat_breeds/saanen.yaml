id: VBO:0000827
name: Saanen
description: >-
  A large Swiss dairy goat with a short white coat, from the Saanental in the
  Bernese Oberland. It is kept for milk in more than eighty countries.
record_term:
  id: VBO:0000827
  label: Saanen (Goat)
synonyms:
