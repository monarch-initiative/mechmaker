id: datmech:44413
name: 44413 East Palestine, Ohio
description: ZIP code 44413 is East Palestine, Ohio, a village that draws its drinking water from five wells. On February 3, 2023, a Norfolk Southern freight train derailed there; some cars spilled into a ditch that feeds Sulphur Run, and the spill reached streams as far as the Ohio River. Vinyl chloride has not been detected in the village's drinking water or supply wells.
description_evidence:
  - reference: url:https://eastpalestine-oh.gov/wp-content/uploads/2025-CCR.pdf
    supports: SUPPORT
    evidence_source: UTILITY_RECORD
    snippet: from an alluvial sand-and-gravel aquifer flowing from the northwest. There are five wells ranging from 50 to 100 feet in depth at the water plant.
  - reference: url:https://www.epa.gov/east-palestine-oh-train-derailment
    reference_title: East Palestine, Ohio Train Derailment | US EPA
    supports: SUPPORT
    evidence_source: GOVERNMENT_RECORD
    snippet: At about 8:55 PM ET on February 3, 2023, a Norfolk Southern freight train derailed in East Palestine, Ohio, about a quarter-mile west of the Ohio-Pennsylvania state line.
  - reference: url:https://www.epa.gov/east-palestine-oh-train-derailment/background
    reference_title: Background | US EPA
    supports: SUPPORT
    evidence_source: GOVERNMENT_RECORD
    snippet: Some cars spilled their loads into an adjacent ditch that feeds Sulphur Run, a stream that joins Leslie Run, which eventually empties into the Ohio River.
  - reference: url:https://www.epa.gov/east-palestine-oh-train-derailment/did-drinking-water-samples-american-legion-east-palestine-have
    reference_title: Did drinking water samples from the American Legion in East Palestine have detections of vinyl chloride? | US EPA
    supports: SUPPORT
    evidence_source: GOVERNMENT_RECORD
    snippet: has been tested weekly since the incident and vinyl chloride has not been detected in the drinking water, nor any of the water supply wells.
