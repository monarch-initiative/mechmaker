# Close issues labelled duplicate-pending once three days pass with no human
# objection, and clear the label where someone objected. No model runs here.
# Scheduled runs act; runs started by hand are dry runs unless told otherwise.
name: Close duplicates

on:
  schedule:
    - cron: "17 9 * * *"  # daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview closures without changing issues
        type: boolean
        default: true
      max_closures:
        description: Most closures in one run (1 to 50)
        type: number
        default: 5

permissions: {}

concurrency:
  group: auto-close-duplicates
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MAX_CLOSURES: ${{ inputs.max_closures || 5 }}
        with:
          script: |
            const { closeDuplicates } = require('./.github/scripts/issue-duplicates.js');
            await closeDuplicates(github, context.repo, {
              dryRun: process.env.DRY_RUN === 'true',
              maxClosures: Number(process.env.MAX_CLOSURES),
              log: core.info,
              warn: core.warning,
            });

