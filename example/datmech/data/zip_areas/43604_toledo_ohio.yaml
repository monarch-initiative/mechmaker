incidents:
  - name: Toledo do-not-drink advisory of August 2014
    incident_kind: TOXIC_BLOOM
    start_date: '2014-08-01'
    end_date: '2014-08-04'
    description: Microcystin in water from the Collins Park plant reached 3.19 μg/L, and the city told almost 500,000 people in northwest Ohio and southeast Michigan not to drink it.
    cause: A bloom dominated by Microcystis in western Lake Erie; a wind event carried microcystin-rich water from Maumee Bay along the shore past the city's intake.
    processes:
      - preferred_term: cyanobacterial bloom
        term:
          id: ENVO:02500018
          label: algal bloom process
        evidence:
          - reference: PMID:28535339
            reference_title: 'Ecophysiological Examination of the Lake Erie Microcystis Bloom in 2014: Linkages between Biology and the Water Supply Shutdown of Toledo, OH.'
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: Annual cyanobacterial blooms dominated by Microcystis have occurred in western Lake Erie
    contaminants:
      - preferred_term: microcystin
        term:
          id: CHEBI:48041
          label: microcystin
        evidence:
          - reference: PMID:27607896
            reference_title: Community Needs Assessment After Microcystin Toxin Contamination of a Municipal Water Supply - Lucas County, Ohio, September 2014.
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: routine testing at the Collins Park Water Treatment Plant in Lucas County, Ohio, revealed microcystin toxin levels in drinking water had reached 3.19 μg/L
        notes: The sources name microcystin, not a congener; microcystin-LR is not bound.
    organisms:
      - preferred_term: Microcystis
        term:
          id: NCBITaxon:1125
          label: Microcystis <cyanobacteria>
        evidence:
          - reference: PMID:28535339
            reference_title: 'Ecophysiological Examination of the Lake Erie Microcystis Bloom in 2014: Linkages between Biology and the Water Supply Shutdown of Toledo, OH.'
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: These data were used to generate a basin-wide ecophysiological fingerprint of Lake Erie Microcystis populations in August 2014
        notes: The sources name the genus; Microcystis aeruginosa is not bound.
    affected_waters:
      - preferred_term: Lake Erie
        term: *id001
        evidence:
          - reference: PMID:28535339
            reference_title: 'Ecophysiological Examination of the Lake Erie Microcystis Bloom in 2014: Linkages between Biology and the Water Supply Shutdown of Toledo, OH.'
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: simulation data suggest a wind event caused microcystin-rich water from Maumee Bay to be transported east along the southern shoreline past the Toledo water intake.
    affected_facilities:
      - Collins Park Water Treatment Plant
    advisories:
      - advisory_kind: DO_NOT_DRINK
        issued_by: City of Toledo
        start_date: '2014-08-02'
        end_date: '2014-08-04'
        population_affected: 500000
        description: Given as almost 500,000 people (US EPA) and more than half a million (Wikipedia); recorded as 500,000.
        evidence:
          - reference: PMID:27607896
            reference_title: Community Needs Assessment After Microcystin Toxin Contamination of a Municipal Water Supply - Lucas County, Ohio, September 2014.
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: On August 2, a do-not-drink advisory was issued
          - reference: PMID:27607896
            reference_title: Community Needs Assessment After Microcystin Toxin Contamination of a Municipal Water Supply - Lucas County, Ohio, September 2014.
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: On August 4, 2014, the advisory was lifted after multiple water samples confirmed microcystin toxin levels had dropped below the advisory threshold.
          - reference: url:https://www.epa.gov/archive/epapages/newsroom_archive/newsreleases/bde0db3444ccc70685257d480067d3ff.html
            reference_title: '09/03/2014: Great Lakes Restoration Initiative Provides Funding to Target Harmful Algal Blooms in Lake Erie'
            supports: SUPPORT
            evidence_source: GOVERNMENT_RECORD
            snippet: the City of Toledo issued a "Do Not Drink" order for almost 500,000 people in northwest Ohio and southeast Michigan
          - reference: WIKIPEDIA:Toledo,_Ohio
            reference_title: Toledo, Ohio
            supports: SUPPORT
            evidence_source: ENCYCLOPEDIA
            snippet: On the evening of August 1, 2014, the city of Toledo issued a warning to citizens advising against the use of city water, leaving more than half a million people suddenly without water.
    evidence:
      - reference: PMID:28535339
        reference_title: 'Ecophysiological Examination of the Lake Erie Microcystis Bloom in 2014: Linkages between Biology and the Water Supply Shutdown of Toledo, OH.'
        supports: SUPPORT
        evidence_source: PUBLICATION
        snippet: the one experienced by the city of Toledo in August of 2014, when the city was rendered without drinking water for >2 days
discussions:
  - discussion_id: toledo-2014-advisory-start
    prompt: Did the 2014 advisory begin on August 1 or August 2?
    kind: CONTROVERSY
    status: OPEN
    attaches_to:
      - incidents
    rationale: Wikipedia says the city warned residents on the evening of August 1; CDC's MMWR says the do-not-drink advisory was issued on August 2. The record keeps August 2 for the advisory and August 1 for the incident's start.
  - discussion_id: toledo-second-huc8
    prompt: Add the second subbasin the ZIP area crosses, HUC8 04100001 Ottawa-Stony.
    kind: CURATION_TODO
    status: OPEN
    attaches_to:
      - watersheds
    rationale: The ZCTA's polygon, intersected with the Watershed Boundary Dataset on 2026-10-09, touches HUC8s 04100009 and 04100001; only the one at the interior point is cited. A citable query for the second is still to be written.
