# mechmaker: a Copier template for new Mechs, and for the Coordinator of a
# Fleet of them.
#
# A Mech is an AI agent-curated, ontology-grounded, evidence-backed knowledge
# base. See https://monarch-initiative.github.io/mechregistry/docs/what-is-a-mech.html
#
# The template lays down the deterministic part of a Mech: package layout, a
# starting LinkML schema, the shared Discussion/Dataset and history modules,
# the validation gates, the justfile, CI, and the curation skills. The domain
# part (what a record is, which sections it carries, which sources feed it) is
# left to an agent working from the skills in this repository's `skills/`.
#
# The same file makes a second kind of repository: the Coordinator of a Fleet,
# a set of Mechs with declared relationships between them. `kind` chooses
# which. A Coordinator renders from coordinator/ and asks only the questions
# marked for it; every Mech question is gated on kind == 'mech'.

_min_copier_version: "9.8.0"
_subdirectory: "{{ 'coordinator' if kind == 'coordinator' else 'template' }}"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
# A Fleet member's canon belongs to its Coordinator: `fleet sync` writes the
# shared schema modules and the pin, and an update from mechmaker leaves them.
_skip_if_exists:
  - "{{ 'fleet/pin.yaml' if kind == 'mech' and fleet_name else '.copier-skip-none' }}"
  - "{{ 'src/' ~ mech_slug ~ '/schema/mech_shared.yaml' if kind == 'mech' and fleet_name else '.copier-skip-none' }}"
  - "{{ 'src/' ~ mech_slug ~ '/schema/history.yaml' if kind == 'mech' and fleet_name else '.copier-skip-none' }}"
_envops:
  keep_trailing_newline: true

_message_after_copy: |
  {% if kind == 'coordinator' -%}
  {{ fleet_name }}'s Coordinator is laid down in {{ _copier_conf.dst_path }}.

  Next:
    cd {{ _copier_conf.dst_path }}
    git init -b main && just install && just qc

  Then declare the Fleet's Mechs and their relationships in fleet.yaml.
  Ask your agent to run the `make-fleet` skill from mechmaker.
  {%- else -%}
  {{ mech_name }} is laid down in {{ _copier_conf.dst_path }}.

  Next:
    cd {{ _copier_conf.dst_path }}
    git init -b main && just install && just qc

  Then design the domain model. Ask your agent to run the
  `design-mech-schema` skill from mechmaker, or read docs/DOMAIN.md.
  {%- endif %}

# ---------------------------------------------------------------- kind

kind:
  type: str
  help: >-
    What to make: one Mech, or the Coordinator of a Fleet (a repository that
    declares a set of Mechs and the relationships between them, holds the
    files they share, and checks them together)
  choices:
    "A Mech": mech
    "A Fleet's Coordinator": coordinator
  default: mech
  # Asked on a first copy, and kept once answered. A Mech made before `kind`
  # existed has a mech_slug and no kind: an update leaves it a Mech instead of
  # offering to turn it into a Coordinator.
  when: "{{ kind is defined or mech_slug is not defined }}"

# ---------------------------------------------------------------- the Fleet

fleet_name:
  type: str
  help: >-
    The Fleet's name, CamelCase, ending in "Fleet" by convention (e.g.
    MicrobeFleet). A Coordinator needs one. For a Mech, the Fleet it is a
    member of, or empty for none; the Coordinator's `fleet answers <slug>`
    gives a member this and its other fleet answers
  default: ""
  validator: >-
    {% if kind == 'coordinator' and not fleet_name %}
    A Coordinator needs the Fleet's name.
    {% elif fleet_name and not (fleet_name | regex_search('^[A-Z][A-Za-z0-9]*$')) %}
    Use CamelCase letters and digits only, starting with a capital.
    {% endif %}

fleet_slug:
  type: str
  help: Lowercase identifier for the Fleet. Names the Coordinator's package and its repository
  default: "{{ fleet_name | lower }}"
  when: "{{ kind == 'coordinator' }}"
  validator: >-
    {% if not (fleet_slug | regex_search('^[a-z][a-z0-9]*$')) %}
    Use lowercase letters and digits only, starting with a letter.
    {% endif %}

fleet_description:
  type: str
  help: One or two sentences on what the Fleet's Mechs cover together
  default: "{{ fleet_name }} is a Fleet of coordinated Mechs."
  when: "{{ kind == 'coordinator' }}"

coordinator_workflows:
  type: str
  help: >-
    GitHub workflows for the Coordinator beyond its always-on QC check. None
    runs an agent
  multiselect: true
  choices:
    "Audit the whole Fleet daily, and open an issue here when it fails": fleet-audit
    "Publish the Fleet's documentation site to GitHub Pages": docs
  default: [fleet-audit, docs]
  when: "{{ kind == 'coordinator' }}"

# ---------------------------------------------------------------- identity

mech_name:
  type: str
  when: "{{ kind == 'mech' }}"
  help: Display name of the Mech, CamelCase, ending in "Mech" by convention (e.g. HabitatMech)
  validator: >-
    {% if not (mech_name | regex_search('^[A-Z][A-Za-z0-9]*$')) %}
    Use CamelCase letters and digits only, starting with a capital.
    {% endif %}

mech_slug:
  type: str
  when: "{{ kind == 'mech' }}"
  help: Lowercase identifier. Used for the package, the schema, the CURIE prefix and the registry id
  default: "{{ mech_name | lower }}"
  validator: >-
    {% if not (mech_slug | regex_search('^[a-z][a-z0-9]*$')) %}
    Use lowercase letters and digits only, starting with a letter.
    {% endif %}

full_title:
  type: str
  when: "{{ kind == 'mech' }}"
  help: Long title (e.g. "Disorder Mechanisms Knowledge Base")
  default: "{{ mech_name }} Knowledge Base"

description:
  type: str
  when: "{{ kind == 'mech' }}"
  help: One or two sentences on what the Mech records and why
  default: "{{ mech_name }} is an AI agent-curated, evidence-backed knowledge base."

# ---------------------------------------------------------------- the record

record_class:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    LinkML class name for one record, CamelCase and singular (e.g. Disease,
    Habitat, CellStructure, Antibiotic)
  validator: >-
    {% if not (record_class | regex_search('^[A-Z][A-Za-z0-9]*$')) %}
    Use CamelCase letters and digits only, starting with a capital.
    {% endif %}

record_noun:
  type: str
  when: "{{ kind == 'mech' }}"
  help: Human-readable singular noun for one record (e.g. "disorder", "habitat")
  default: "{{ record_class | regex_replace('(?<!^)([A-Z])', ' \\\\1') | lower }}"

record_article:
  type: str
  when: false
  default: "{{ 'an' if record_noun[:1] in ['a', 'e', 'i', 'o', 'u'] else 'a' }}"

records_dir:
  type: str
  when: "{{ kind == 'mech' }}"
  help: Repository-relative directory that holds one YAML file per record
  default: "data/{{ record_noun | replace(' ', '_') }}s"
  validator: >-
    {% if not records_dir.strip() %}
    Give a directory, e.g. data/widgets.
    {% elif records_dir.startswith('/') or '..' in records_dir or '.' in records_dir.split('/') %}
    Give a relative path inside the repository, with no "." or "..".
    {% elif records_dir.endswith('/') %}
    Leave off the trailing slash: data/widgets, not data/widgets/.
    {% elif not (records_dir | regex_search('^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$')) %}
    Use letters, digits, ".", "_" and "-", with single slashes between folders.
    {% endif %}

term_backend:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    Where term checks look up the ontologies chosen from the catalog. OLS asks
    EBI's Ontology Lookup Service online and downloads nothing. SQLite
    downloads each ontology once, as a prebuilt semantic-sql file from OBO
    Foundry sources, and then works offline. Ontologies added with
    extra_ontologies name their own adapter
  choices:
    "OLS, online (nothing to download)": ols
    "SQLite, downloaded once, then offline": sqlite
  default: ols

identity_prefix:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    Ontology prefix whose CURIEs key records where a term exists (e.g. MONDO,
    ENVO, CHEBI, GO). Leave empty to mint every id in the Mech's own namespace
  default: ""
  validator: >-
    {% if identity_prefix and not (identity_prefix | regex_search('^[A-Za-z][A-Za-z0-9_]*$')) %}
    A prefix is letters, digits and underscores, e.g. MONDO.
    {% elif identity_prefix == mech_slug %}
    {{ mech_slug }} is the Mech's own namespace. Leave this empty to mint every id in it.
    {% endif %}

identity_root:
  type: str
  help: >-
    Root term that every identity CURIE must descend by is-a from (e.g.
    MONDO:0000001). Required: without it no identity term is checked at all.
    Pick the most specific root that still covers every record, and check a
    few expected records sit under it
  when: "{{ kind == 'mech' and (identity_prefix != '') }}"
  validator: >-
    {% if not identity_root %}
    A root is required. linkml-term-validator checks only bound terms.
    {% elif not identity_root.startswith(identity_prefix ~ ':') %}
    The root must carry the identity prefix ({{ identity_prefix }}:).
    {% endif %}

identity_uri:
  type: str
  help: URI expansion of the identity prefix
  default: "http://purl.obolibrary.org/obo/{{ identity_prefix }}_"
  when: "{{ kind == 'mech' and (identity_prefix != '') }}"

identity_adapter:
  type: str
  help: >-
    OAK adapter used to check identity terms: ols:<name>, sqlite:obo:<name>,
    bioportal:<name>, a local file such as simpleobo:ontologies/<file>.obo,
    or "" to skip. One prefix, one adapter: if an ontology picked below has
    this prefix, this adapter checks its terms too
  default: "{{ 'ols:' if term_backend == 'ols' else 'sqlite:obo:' }}{{ identity_prefix | lower }}"
  when: "{{ kind == 'mech' and (identity_prefix != '') }}"

identity_direct_only:
  type: bool
  help: |-
    Are records only the root's direct children? Answer yes when the
    level just below the root is the kind of thing a record describes, and
    terms further down are something else.
    YES, goat breeds in VBO. Under VBO:0400025 (Goat breed) sit breeds,
    such as VBO:0000827 (Saanen). One level lower sit national populations,
    such as VBO:0009093 (Saanen, Argentina). A population is not a breed,
    so it must not key a record.
    NO, diseases in MONDO. MONDO:0005015 (diabetes mellitus) sits under
    MONDO:0000001 (disease) but is not its direct child, and
    MONDO:0005148 (type 2 diabetes mellitus) sits below that. Each is a
    disease, and each can be a record. Yes would reject them all.
    To decide, look two levels below the root. If a term there is still
    the kind of thing a record describes, answer no. Check a few expected
    records with `check_terms.py under --direct`. With yes, the root itself
    cannot key a record either. `just check-identity` enforces the rule, in
    `just qc-full`.
  default: false
  when: "{{ kind == 'mech' and (identity_prefix != '') }}"

# The ontologies offered below, with their verified roots. Defined before the
# questions so the extra_ontologies validator can read it.
ontology_catalog:
  type: yaml
  when: false
  default: |
    GO_BP:
      prefix: GO
      uri: http://purl.obolibrary.org/obo/GO_
      adapter: ols:go
      descriptor: BiologicalProcessDescriptor
      enum: BiologicalProcessTerm
      slot: biological_processes
      root: GO:0008150
      root_label: biological_process
      noun: biological process
      category: biolink:BiologicalProcess
    GO_MF:
      prefix: GO
      uri: http://purl.obolibrary.org/obo/GO_
      adapter: ols:go
      descriptor: MolecularFunctionDescriptor
      enum: MolecularFunctionTerm
      slot: molecular_functions
      root: GO:0003674
      root_label: molecular_function
      noun: molecular function
      category: biolink:MolecularActivity
    GO_CC:
      prefix: GO
      uri: http://purl.obolibrary.org/obo/GO_
      adapter: ols:go
      descriptor: CellularComponentDescriptor
      enum: CellularComponentTerm
      slot: cellular_components
      root: GO:0005575
      root_label: cellular_component
      noun: cellular component
      category: biolink:CellularComponent
    CL:
      prefix: CL
      uri: http://purl.obolibrary.org/obo/CL_
      adapter: ols:cl
      descriptor: CellTypeDescriptor
      enum: CellTypeTerm
      slot: cell_types
      root: CL:0000000
      root_label: cell
      noun: cell type
      category: biolink:Cell
    UBERON:
      prefix: UBERON
      uri: http://purl.obolibrary.org/obo/UBERON_
      adapter: ols:uberon
      descriptor: AnatomicalEntityDescriptor
      enum: AnatomicalEntityTerm
      slot: anatomical_entities
      root: UBERON:0001062
      root_label: anatomical entity
      noun: anatomical entity
      category: biolink:AnatomicalEntity
    CHEBI:
      prefix: CHEBI
      uri: http://purl.obolibrary.org/obo/CHEBI_
      adapter: ols:chebi
      descriptor: ChemicalEntityDescriptor
      enum: ChemicalEntityTerm
      slot: chemical_entities
      root: CHEBI:24431
      root_label: chemical entity
      noun: chemical entity
      category: biolink:ChemicalEntity
    HP:
      prefix: HP
      uri: http://purl.obolibrary.org/obo/HP_
      adapter: ols:hp
      descriptor: PhenotypeDescriptor
      enum: PhenotypeTerm
      slot: phenotypes
      root: HP:0000118
      root_label: Phenotypic abnormality
      noun: phenotype
      category: biolink:PhenotypicFeature
    MONDO:
      prefix: MONDO
      uri: http://purl.obolibrary.org/obo/MONDO_
      adapter: ols:mondo
      descriptor: DiseaseDescriptor
      enum: DiseaseTerm
      slot: diseases
      root: MONDO:0000001
      root_label: disease
      noun: disease
      category: biolink:Disease
    NCBITaxon:
      prefix: NCBITaxon
      uri: http://purl.obolibrary.org/obo/NCBITaxon_
      adapter: ols:ncbitaxon
      descriptor: OrganismDescriptor
      enum: OrganismTerm
      slot: organisms
      root: NCBITaxon:1
      root_label: root
      noun: organism
      category: biolink:OrganismTaxon
    ENVO:
      prefix: ENVO
      uri: http://purl.obolibrary.org/obo/ENVO_
      adapter: ols:envo
      descriptor: EnvironmentDescriptor
      enum: EnvironmentTerm
      slot: environments
      root: ENVO:01000254
      root_label: environmental system
      noun: environment
      category: biolink:EnvironmentalFeature
    PATO:
      prefix: PATO
      uri: http://purl.obolibrary.org/obo/PATO_
      adapter: ols:pato
      descriptor: QualityDescriptor
      enum: QualityTerm
      slot: qualities
      root: PATO:0000001
      root_label: quality
      noun: quality
      category: biolink:PhenotypicQuality
    OBI:
      prefix: OBI
      uri: http://purl.obolibrary.org/obo/OBI_
      adapter: ols:obi
      descriptor: AssayDescriptor
      enum: AssayTerm
      slot: assays
      root: OBI:0000070
      root_label: assay
      noun: assay
      category: biolink:NamedThing
    UO:
      prefix: UO
      uri: http://purl.obolibrary.org/obo/UO_
      adapter: ols:uo
      descriptor: UnitDescriptor
      enum: UnitTerm
      slot: units
      root: UO:0000000
      root_label: unit
      noun: unit
      article: A
      category: biolink:NamedThing
    PR:
      prefix: PR
      uri: http://purl.obolibrary.org/obo/PR_
      adapter: ols:pr
      descriptor: ProteinDescriptor
      enum: ProteinTerm
      slot: proteins
      root: PR:000000001
      root_label: protein
      noun: protein
      category: biolink:Protein
    SO:
      prefix: SO
      uri: http://purl.obolibrary.org/obo/SO_
      adapter: ols:so
      descriptor: SequenceFeatureDescriptor
      enum: SequenceFeatureTerm
      slot: sequence_features
      root: SO:0000110
      root_label: sequence_feature
      noun: sequence feature
      category: biolink:NamedThing
    MAXO:
      prefix: MAXO
      uri: http://purl.obolibrary.org/obo/MAXO_
      adapter: ols:maxo
      descriptor: MedicalActionDescriptor
      enum: MedicalActionTerm
      slot: medical_actions
      root: MAXO:0000001
      root_label: medical action
      noun: medical action
      category: biolink:Procedure
    FOODON:
      prefix: FOODON
      uri: http://purl.obolibrary.org/obo/FOODON_
      adapter: ols:foodon
      descriptor: FoodDescriptor
      enum: FoodTerm
      slot: foods
      root: FOODON:00001002
      root_label: food product
      noun: food
      category: biolink:Food
    VBO:
      prefix: VBO
      uri: http://purl.obolibrary.org/obo/VBO_
      adapter: ols:vbo
      descriptor: BreedDescriptor
      enum: BreedTerm
      slot: breeds
      root: VBO:0400000
      root_label: Vertebrate breed
      noun: breed
      category: biolink:NamedThing
    VT:
      prefix: VT
      uri: http://purl.obolibrary.org/obo/VT_
      adapter: ols:vt
      descriptor: TraitDescriptor
      enum: TraitTerm
      slot: traits
      root: VT:0000001
      root_label: vertebrate trait
      noun: trait
      category: biolink:NamedThing
    NCIT_COUNTRY:
      prefix: NCIT
      uri: http://purl.obolibrary.org/obo/NCIT_
      adapter: ols:ncit
      descriptor: CountryDescriptor
      enum: CountryTerm
      slot: countries
      root: NCIT:C25464
      root_label: Country
      noun: country
      category: biolink:GeographicLocation

ontologies:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    Ontologies the record binds terms to. Each one adds a descriptor class, a
    dynamic enum and a record section to the starting schema
  multiselect: true
  choices:
    "GO biological process": GO_BP
    "GO molecular function": GO_MF
    "GO cellular component": GO_CC
    "CL cell types": CL
    "UBERON anatomy": UBERON
    "CHEBI chemical entities": CHEBI
    "HP phenotypes (human)": HP
    "MONDO diseases": MONDO
    "NCBITaxon organisms": NCBITaxon
    "ENVO environments": ENVO
    "PATO qualities": PATO
    "OBI assays": OBI
    "UO units": UO
    "PR proteins": PR
    "SO sequence features": SO
    "MAXO medical actions": MAXO
    "FOODON foods": FOODON
    "VBO vertebrate breeds": VBO
    "VT vertebrate traits": VT
    "NCIT countries": NCIT_COUNTRY
  default: [GO_BP, CHEBI, NCBITaxon]

extra_ontologies:
  type: yaml
  when: "{{ kind == 'mech' }}"
  multiline: true
  help: >-
    Ontologies outside the catalog, as a YAML list. Each one gets a descriptor
    class, a dynamic enum and a record section, as a catalog ontology does.
    Any ontology OAK can read works: on OLS (adapter ols:po), from OBO Foundry
    (sqlite:obo:po), on BioPortal (bioportal:<acronym>, needs
    BIOPORTAL_API_KEY), or a local file in the repository
    (simpleobo:ontologies/my.obo, pronto:ontologies/my.owl,
    sqlite:ontologies/my.db). Each item needs prefix, root, root_label and
    noun. adapter (default ols:<prefix>), uri (default the OBO PURL), slot,
    descriptor, enum and category (the Biolink class of its terms in KGX
    exports, default biolink:NamedThing) are optional. Its prefix and slot must
    differ from those of every ontology picked above and every other extra.
    Check the root before using it.
    Example: [{prefix: PO, root: "PO:0025131", root_label: plant anatomical entity, noun: plant structure}]
  default: []
  validator: >-
    {%- if extra_ontologies is not sequence or extra_ontologies is string -%}
    Give a YAML list, e.g. [{prefix: PO, root: "PO:0025131", root_label: plant anatomical entity, noun: plant structure}].
    {%- else -%}
    {#- Prefixes and slots already taken: the catalog picks, then each extra in turn.
        The slot default repeats the plural rule in ontology_selection. -#}
    {%- set seen = namespace(prefixes=[], slots=[]) -%}
    {%- for key in ontologies if key in ontology_catalog -%}
    {%- set seen.prefixes = seen.prefixes + [ontology_catalog[key].prefix] -%}
    {%- set seen.slots = seen.slots + [ontology_catalog[key].slot] -%}
    {%- endfor -%}
    {%- for x in extra_ontologies -%}
    {%- set noun = x.noun | string | trim if x is mapping else '' -%}
    {%- set plural = (noun[:-1] ~ 'ies') if (noun.endswith('y') and noun[-2:-1] not in 'aeiou') else (noun ~ 'es' if noun.endswith(('s', 'x', 'ch', 'sh')) else noun ~ 's') -%}
    {%- set slot = (x.slot | default(plural | replace(' ', '_') | lower)) | string if x is mapping else '' -%}
    {%- if x is not mapping -%}
    Item {{ loop.index }} is not a mapping.
    {%- elif not (x.prefix and x.root and x.root_label and x.noun) -%}
    Item {{ loop.index }} needs prefix, root, root_label and noun.
    {%- elif not (x.prefix | string | regex_search('^[A-Za-z][A-Za-z0-9_]*$')) -%}
    Item {{ loop.index }}: a prefix is letters, digits and underscores.
    {%- elif not (x.root | string).startswith(x.prefix ~ ':') -%}
    Item {{ loop.index }}: the root {{ x.root }} must carry the prefix {{ x.prefix }}.
    {%- elif not ((x.noun | string) | regex_search('^[A-Za-z][A-Za-z0-9 ]*$')) -%}
    Item {{ loop.index }}: the noun is letters, digits and spaces, e.g. "trait".
    {%- elif (x.prefix | string) == mech_slug -%}
    Item {{ loop.index }}: {{ mech_slug }} is the Mech's own namespace, not an ontology.
    {%- elif (x.prefix | string) in seen.prefixes -%}
    Item {{ loop.index }}: the prefix {{ x.prefix }} is already bound by a picked ontology or an earlier extra.
    {%- elif slot in seen.slots -%}
    Item {{ loop.index }}: the slot {{ slot }} is already used by a picked ontology or an earlier extra. Give it another slot.
    {%- elif identity_prefix and (x.prefix | string) == identity_prefix and x.adapter is defined and x.adapter != identity_adapter -%}
    Item {{ loop.index }}: {{ x.prefix }} keys records, so identity_adapter ({{ identity_adapter }}) checks its terms. Drop this adapter, or give identity_adapter {{ x.adapter }} instead.
    {%- endif -%}
    {%- if x is mapping -%}
    {%- set seen.prefixes = seen.prefixes + [x.prefix | string] -%}
    {%- set seen.slots = seen.slots + [slot] -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}

# Every ontology a Mech binds: the catalog picks, then extra_ontologies, with
# names filled in. The templates read this, never the catalog directly.
ontology_selection:
  type: yaml
  when: false
  default: >-
    {%- set sel = [] -%}
    {%- for key in ontologies if key in ontology_catalog -%}
    {%- set o = ontology_catalog[key] -%}
    {%- set _ = sel.append({
      "key": key, "prefix": o.prefix, "uri": o.uri,
      "adapter": identity_adapter if (identity_prefix and o.prefix == identity_prefix)
        else o.adapter if term_backend == 'ols' else o.adapter | replace('ols:', 'sqlite:obo:'),
      "descriptor": o.descriptor, "enum": o.enum, "slot": o.slot, "root": o.root,
      "root_label": o.root_label, "noun": o.noun, "category": o.category,
      "article": o.article | default('An' if o.noun[0] in 'aeiou' else 'A')}) -%}
    {%- endfor -%}
    {%- for x in extra_ontologies if x is mapping -%}
    {%- set noun = x.noun | string | trim -%}
    {%- set camel = noun.split() | map('capitalize') | join('') -%}
    {%- set plural = (noun[:-1] ~ 'ies') if (noun.endswith('y') and noun[-2:-1] not in 'aeiou') else (noun ~ 'es' if noun.endswith(('s', 'x', 'ch', 'sh')) else noun ~ 's') -%}
    {%- set _ = sel.append({
      "key": x.prefix, "prefix": x.prefix | string,
      "uri": x.uri | default('http://purl.obolibrary.org/obo/' ~ x.prefix ~ '_'),
      "adapter": identity_adapter if (identity_prefix and x.prefix | string == identity_prefix)
        else x.adapter | default('ols:' ~ (x.prefix | lower)),
      "descriptor": x.descriptor | default(camel ~ 'Descriptor'),
      "enum": x.enum | default(camel ~ 'Term'),
      "slot": x.slot | default(plural | replace(' ', '_') | lower),
      "root": x.root | string, "root_label": x.root_label | string, "noun": noun,
      "category": x.category | default('biolink:NamedThing'),
      "article": 'An' if noun[0] | lower in 'aeiou' else 'A'}) -%}
    {%- endfor -%}
    {{ sel | tojson }}

causal_graphs:
  type: bool
  when: "{{ kind == 'mech' }}"
  help: Include mechanism nodes and causal edges, the pathograph pattern from DisMech
  default: true

taxon_scope:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    NCBITaxon CURIEs the Mech is scoped to, comma-separated (e.g.
    NCBITaxon:9606). Leave empty if not taxon-scoped
  default: ""

domains:
  type: str
  when: "{{ kind == 'mech' }}"
  help: MechRegistry domain tags (the registry's DomainEnum)
  multiselect: true
  choices: [biomedical, clinical, microbiology, environment, organisms, phenotype,
            pathways, pharmacology, genomics, immunology, nutrition, other]
  default: [other]
  validator: "{% if not domains %}Pick at least one; the registry requires it.{% endif %}"

# ---------------------------------------------------------------- people

author_name:
  type: str
  help: Maintainer name

author_email:
  type: str
  help: Maintainer email

author_orcid:
  type: str
  help: Maintainer ORCID (0000-0000-0000-0000), or empty
  default: ""
  validator: >-
    {% if author_orcid and not (author_orcid | regex_search('^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$')) %}
    An ORCID looks like 0000-0002-1825-0097.
    {% endif %}

github_org:
  type: str
  help: GitHub organization or user that will own the repository

github_user:
  type: str
  help: Maintainer GitHub login
  default: "{{ github_org }}"

repo_name:
  type: str
  help: GitHub repository name
  default: "{{ fleet_slug ~ '-coordinator' if kind == 'coordinator' else mech_slug }}"

collection:
  type: str
  when: "{{ kind == 'mech' }}"
  help: Which family of Mechs this one joins
  choices:
    "Monarch Initiative (DisMech pattern)": monarch
    "X-Mech suite (CultureBotAI fleet, claw-governed)": xmech
    "Neither": none
  default: none

# A Mech in a Fleet: its Coordinator, and the links its records make to other
# members' records. The Coordinator writes both: `fleet answers <slug>`.
fleet_coordinator:
  type: str
  help: GitHub owner/repo of the Fleet's Coordinator, which holds the files every member shares
  default: "{{ github_org }}/{{ fleet_name | lower }}-coordinator"
  when: "{{ kind == 'mech' and fleet_name != '' }}"
  validator: >-
    {% if not (fleet_coordinator | regex_search('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$')) %}
    Give the Coordinator's repository as owner/repo.
    {% endif %}

# Names every Mech's schema holds, apart from those its answers add (the
# record class, the ontologies' slots, descriptors and enums). A link's slot,
# class or enums may not reuse one. The Coordinator's manifest.py keeps the
# same lists, and tests/test_fleet.py checks both against a render.
fleet_reserved_names:
  type: yaml
  when: false
  default:
    slots: [action, creation_date, curation_history, curator, datasets, description,
            description_evidence, discussions, downstream, evidence, evidence_source,
            explanation, id, label, llm_assisted, mechanisms, model, name, notes,
            preferred_term, record_term, reference, reference_title, snippet, status,
            supports, synonyms, target, term, timestamp, updated_date]
    classes: [CausalEdge, CrossCorpusLink, CurationActionEnum, CurationEvent,
              CurationStatusEnum, Dataset, DatasetRepositoryEnum, DatasetTypeEnum,
              Descriptor, Discussion, DiscussionKindEnum, DiscussionStatusEnum,
              EvidenceItem, EvidenceSourceEnum, EvidenceSupportEnum, HistoryActor,
              HistoryActorTypeEnum, HistoryEvent, HistoryEventTypeEnum, HistoryLinks,
              HistoryOutcomeEnum, HistoryRecord, HistorySession, HistoryTarget,
              HistoryTargetKindEnum, IdentityTerm, MechanismNode, ProposedExperiment, SupportLevelEnum,
              SupportingReference, Term]

fleet_links:
  type: yaml
  help: >-
    Links from this Mech's records to other members' records, one per
    relationship the Fleet declares with this Mech as subject. Each has slot,
    target (the other Mech's name), prefix (its slug) and relations (NAME:
    description), and may have bases, description, class and uri. Copy them
    from `fleet answers <slug>` in the Coordinator; do not write them by hand
  default: "[]"
  when: "{{ kind == 'mech' and fleet_name != '' }}"
  validator: >-
    {%- set ns = namespace(err='', slots=[], classes=[]) -%}
    {%- if fleet_links is not sequence or fleet_links is string or fleet_links is mapping -%}
    {%- set ns.err = 'Give a list of links.' -%}
    {%- else -%}
    {%- for x in fleet_links if not ns.err -%}
    {%- if x is not mapping or not x.slot or not x.target or not x.prefix or not x.relations -%}
    {%- set ns.err = 'Each link needs slot, target, prefix and relations.' -%}
    {%- elif not (x.slot | string | regex_search('^[a-z][a-z0-9_]*$')) -%}
    {%- set ns.err = 'Slot ' ~ x.slot ~ ' must be snake_case.' -%}
    {%- elif x.slot in fleet_reserved_names.slots -%}
    {%- set ns.err = 'Slot ' ~ x.slot ~ ' is already a slot of every Mech; choose another name.' -%}
    {%- elif x.slot in ontology_selection | map(attribute='slot') -%}
    {%- set ns.err = 'Slot ' ~ x.slot ~ " is already an ontology's section; choose another name." -%}
    {%- elif not (x.target | string | regex_search('^[A-Z][A-Za-z0-9]*$')) -%}
    {%- set ns.err = 'Target ' ~ x.target ~ ' must be a Mech name, in CamelCase.' -%}
    {%- elif not (x.prefix | string | regex_search('^[a-z][a-z0-9]*$')) or x.prefix == mech_slug -%}
    {%- set ns.err = 'Prefix ' ~ x.prefix ~ " must be another Mech's slug." -%}
    {%- elif x.relations is not mapping -%}
    {%- set ns.err = 'relations of ' ~ x.slot ~ ' must map each NAME to its description.' -%}
    {%- elif x.bases is defined and x.bases is not mapping -%}
    {%- set ns.err = 'bases of ' ~ x.slot ~ ' must map each NAME to its description.' -%}
    {%- else -%}
    {%- for name, text in (x.relations | dictsort) + (x.bases | default({}) | dictsort) -%}
    {%- if not (name | string | regex_search('^[A-Z][A-Z0-9_]*$')) -%}
    {%- set ns.err = 'Relation and basis names are UPPER_SNAKE_CASE: ' ~ name -%}
    {%- elif text is not string -%}
    {%- set ns.err = 'Give ' ~ name ~ ' a description, as text (NAME: what it means).' -%}
    {%- endif -%}
    {%- endfor -%}
    {%- if x.description is defined and x.description is not string -%}
    {%- set ns.err = 'The description of ' ~ x.slot ~ ' must be text.' -%}
    {%- endif -%}
    {%- set cls = x['class'] | default(x.target ~ 'Link') | string -%}
    {%- set taken = fleet_reserved_names.classes + [record_class]
        + (ontology_selection | map(attribute='descriptor') | list)
        + (ontology_selection | map(attribute='enum') | list) -%}
    {%- if not (cls | regex_search('^[A-Z][A-Za-z0-9]*$')) -%}
    {%- set ns.err = 'Class ' ~ cls ~ ' must be CamelCase.' -%}
    {%- elif cls in taken or (cls ~ 'RelationEnum') in taken or (cls ~ 'BasisEnum') in taken -%}
    {%- set ns.err = 'Class ' ~ cls ~ ' (or its enums) is already in the schema; give the link a class.' -%}
    {%- elif x.slot in ns.slots -%}{%- set ns.err = 'Two links use the slot ' ~ x.slot ~ '.' -%}
    {%- elif cls in ns.classes -%}{%- set ns.err = 'Two links make the class ' ~ cls ~ '; give one a class.' -%}
    {%- endif -%}
    {%- set ns.slots = ns.slots + [x.slot] -%}{%- set ns.classes = ns.classes + [cls] -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
    {{ ns.err }}

# ---------------------------------------------------------------- licenses

data_license:
  type: str
  when: "{{ kind == 'mech' }}"
  help: License for the records
  choices:
    "CC BY 4.0": CC-BY-4.0
    "CC0 1.0": CC0-1.0
  default: CC-BY-4.0

code_license:
  type: str
  help: License for the code
  choices:
    "BSD 3-Clause": BSD-3-Clause
    "MIT": MIT
    "Apache 2.0": Apache-2.0
  default: BSD-3-Clause

copyright_year:
  type: str
  help: Copyright year
  default: "{{ '%Y' | strftime }}"

# ---------------------------------------------------------------- options

include_site:
  type: bool
  when: "{{ kind == 'mech' }}"
  help: Add a static record browser, published at /records/ on the documentation site
  default: true

site_palette:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    Main color of the documentation site and record browser (a Material for
    MkDocs color name). Change it later in conf/site.yaml
  choices: [indigo, blue, light-blue, cyan, teal, green, light-green, lime, yellow,
            amber, orange, deep-orange, red, pink, purple, deep-purple, brown, grey, blue-grey]
  default: indigo

site_accent:
  type: str
  when: "{{ kind == 'mech' }}"
  help: Highlight color, for hover and focus (a Material accent name)
  choices: [indigo, blue, light-blue, cyan, teal, green, light-green, lime, yellow,
            amber, orange, deep-orange, red, pink, purple, deep-purple]
  default: "{{ site_palette if site_palette not in ['brown', 'grey', 'blue-grey'] else 'amber' }}"

site_theme:
  type: str
  when: "{{ kind == 'mech' }}"
  help: Light or dark pages. auto follows each visitor's system setting
  choices: [auto, light, dark]
  default: auto

include_claude_hook:
  type: bool
  when: "{{ kind == 'mech' }}"
  help: >-
    Add a Claude Code PreToolUse hook that validates a record before an edit
    to it lands
  default: true

# ---------------------------------------------------------------- workflows
#
# Every GitHub workflow the template knows is listed here. Pick the ones this
# Mech needs now; re-run `copier update` with a changed answer to add or drop
# one later. docs/WORKFLOWS.md in the generated Mech describes each, with what
# it needs (secrets, apps, labels) and when it is worth turning on.

agent_workflows:
  type: yaml
  when: false
  default: "[claude, review, triage, dedupe, pr-shepherd, curation-scanner, literature-scan, compliance, post-review]"

workflows:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    GitHub workflows beyond the always-on QC check. Agent workflows need an
    Anthropic credential as a repository secret; see docs/WORKFLOWS.md
  multiselect: true
  choices:
    "Weekly full check of terms and quotes (no agent)": sweep
    "Publish the documentation site to GitHub Pages (no agent)": docs
    "Hide risky comments from untrusted users (no agent)": comment-guard
    "Close pull requests from forks (no agent)": close-fork-prs
    "Attach a records bundle to each release (no agent)": release-records
    "Warm the reference cache weekly (no agent)": warm-reference-cache
    "Publish the package to PyPI on release (no agent)": pypi-publish
    "Watch the news weekly for stories about records (no agent; needs news_leads)": news-watch
    "Agent: answer @claude mentions": claude
    "Agent: review every pull request": review
    "Agent: label new issues": triage
    "Agent: flag duplicate issues, close after 3 days": dedupe
    "Agent: comment on stuck pull requests": pr-shepherd
    "Agent: work the curation issue queue (needs a GitHub App)": curation-scanner
    "Agent: file issues for new literature": literature-scan
    "Agent: improve the least complete records (needs a GitHub App)": compliance
    "Agent: act on human review comments": post-review
  default: [sweep, docs, comment-guard]

agent_schedules:
  type: bool
  help: >-
    Run the scheduled agent workflows on their schedules. Off means they run
    only when started by hand, which is the safe way to begin
  default: false
  when: "{{ kind == 'mech' and (workflows | select('in', ['pr-shepherd', 'curation-scanner', 'literature-scan', 'compliance', 'post-review']) | list | length > 0) }}"

langfuse:
  type: bool
  help: Send agent traces to Langfuse (needs LANGFUSE_* secrets)
  default: false
  when: "{{ kind == 'mech' and (workflows | select('in', agent_workflows) | list | length > 0) }}"

# ---------------------------------------------------------------- research and outputs

deep_research:
  type: bool
  when: "{{ kind == 'mech' }}"
  help: >-
    Add deep research through deep-research-client: AI research reports on a
    record, from providers such as Claude Code, OpenAI or Edison, as leads for
    curators. Most useful for Mechs built on scholarly literature. Each provider
    needs its own access; claude_code needs only Claude Code
  default: false

news_leads:
  type: bool
  when: "{{ kind == 'mech' }}"
  help: >-
    Add news leads: `just news-leads <record>` searches past news (Google
    News, the news Wikipedia articles cite) for a record's events and writes
    ranked leads to curation/news/, for curators to read and quote from
    archived copies. Worth it when records are about events local news
    reports (incidents, outbreaks, spills, recalls). conf/news.yaml says
    which record fields to search with. The news-watch workflow needs it
  default: "{{ 'news-watch' in workflows }}"
  validator: >-
    {% if 'news-watch' in workflows and not news_leads %}The news-watch workflow
    needs news_leads.{% endif %}

# ---------------------------------------------------------------- structured data ingests

# The structured data ingests mechmaker knows: the Monarch Initiative's, each
# a repository that turns one upstream source into KGX nodes and edges with
# Koza and publishes them as a monthly GitHub release. `files` are the release
# files the Monarch KG build takes (monarch-ingest's
# src/monarch_ingest/ingests.yaml, at 468799f7). `sources` are infores ids,
# from the build receipt of the 2026-10-07 KG release. `produces` are the
# Biolink classes its transforms write. Checked on 2026-10-14; the
# ingest-structured-data skill says how to add or refresh an entry.
ingest_catalog:
  type: yaml
  when: false
  default: |
    alliance:
      repo: monarch-initiative/alliance-ingest
      name: Alliance of Genome Resources
      covers: genes, alleles, genotypes, expression, phenotypes, disease
      description: Transformation of Alliance gene, allele, genotype, disease, phenotype, and expression data
      sources: [infores:agr]
      produces: [Gene, Genotype, SequenceVariant, GeneToDiseaseAssociation, GenotypeToDiseaseAssociation, GeneToPhenotypicFeatureAssociation, GenotypeToPhenotypicFeatureAssociation, GeneToExpressionSiteAssociation]
      files: [alliance_gene_nodes.tsv, alliance_genotype_nodes.tsv, alliance_genotype_edges.tsv, alliance_allele_nodes.tsv, alliance_allele_edges.tsv, alliance_gene_to_expression_edges.tsv, alliance_phenotype_edges.tsv, alliance_disease_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    bgee:
      repo: monarch-initiative/bgee-ingest
      name: Bgee
      covers: gene expression by anatomy
      description: BGee gene to expression ingest
      sources: [infores:bgee]
      produces: [GeneToExpressionSiteAssociation]
      files: [bgee_gene_to_expression_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    biogrid:
      repo: monarch-initiative/biogrid-ingest
      name: BioGRID
      covers: gene-to-gene interactions
      description: BioGRID ingest for gene-to-gene interactions using MITAB format data.
      sources: [infores:biogrid]
      produces: [PairwiseGeneToGeneInteraction]
      files: [biogrid_gene_to_gene_edges.tsv]
      code_license: MIT
      in_monarch_kg: true
    clingen:
      repo: monarch-initiative/clingen-ingest
      name: ClinGen
      covers: gene-disease validity and variants
      description: Conversion of ClinGen variant and gene-disease data to Biolink model format
      sources: [infores:clingen, infores:hgnc]
      produces: [SequenceVariant, CausalGeneToDiseaseAssociation, VariantToDiseaseAssociation, VariantToGeneAssociation]
      files: [clingen_gene_disease_edges.tsv, clingen_variant_nodes.tsv, clingen_variant_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    clinvar:
      repo: monarch-initiative/clinvar-ingest
      name: ClinVar
      covers: variants and their genes and diseases
      description: Modular ingest for ClinVar variants. Creates variant nodes and associations for phenotype, disease, gene, and pathogenicity relationships.
      sources: [infores:clinvar, infores:medgen, infores:mondo]
      produces: [SequenceVariant, VariantToDiseaseAssociation, VariantToGeneAssociation]
      files: [clinvar_variant_nodes.tsv, clinvar_variant_edges.tsv]
      code_license: MIT
      in_monarch_kg: true
    cureid:
      repo: monarch-initiative/cureid-ingest
      name: CURE ID
      covers: drug repurposing case reports
      description: Koza ingest for transforming CURE ID drug repurposing and real-world treatment data into KGX format
      sources: [infores:cureid]
      produces: [Case, CaseToDiseaseAssociation, CaseToGeneAssociation, CaseToPhenotypicFeatureAssociation, ChemicalEntityToDiseaseOrPhenotypicFeatureAssociation, ChemicalOrDrugOrTreatmentAdverseEventAssociation]
      files: [cureid_nodes.tsv, cureid_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    dictybase:
      repo: monarch-initiative/dictybase-ingest
      name: dictyBase
      covers: Dictyostelium genes and phenotypes
      description: Dictybase gene and phenotype ingest
      sources: [infores:dictybase]
      produces: [Gene, GeneToPhenotypicFeatureAssociation]
      files: [dictybase_gene_nodes.tsv, dictybase_gene_to_phenotype_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    go:
      repo: monarch-initiative/go-ingest
      name: Gene Ontology annotations
      covers: gene functions, processes, locations
      description: Modular ingest for Gene Ontology annotations. Creates gene-to-GO term associations for molecular activity, biological process, and cellular component.
      sources: [infores:goa, infores:eco]
      produces: [MacromolecularMachineToMolecularActivityAssociation, MacromolecularMachineToBiologicalProcessAssociation, MacromolecularMachineToCellularComponentAssociation]
      files: [go_annotation_edges.tsv]
      code_license: MIT
      in_monarch_kg: true
      note: Its one file is about 1.1 GB.
    hgnc:
      repo: monarch-initiative/hgnc-ingest
      name: HGNC
      covers: human genes
      description: HGNC human gene ingest
      sources: [infores:hgnc, infores:agr]
      produces: [Gene]
      files: [hgnc_gene_nodes.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    hpoa:
      repo: monarch-initiative/monarch-phenotype-profile-ingest
      name: HPO annotations
      covers: disease and gene phenotypes, inheritance
      description: Monarch KG ingest for phenotypes from HPOA
      sources: [infores:hpoa, infores:hp, infores:mondo]
      produces: [DiseaseToPhenotypicFeatureAssociation, GeneToPhenotypicFeatureAssociation, CausalGeneToDiseaseAssociation, CorrelatedGeneToDiseaseAssociation, DiseaseOrPhenotypicFeatureToGeneticInheritanceAssociation]
      files: [hpoa_disease_mode_of_inheritance_edges.tsv, hpoa_disease_to_phenotype_edges.tsv, hpoa_gene_to_disease_edges.tsv, hpoa_gene_to_phenotype_edges.tsv]
      code_license: MIT
      in_monarch_kg: true
    loinc:
      repo: monarch-initiative/loinc-ingest
      name: LOINC
      covers: clinical measurements
      description: LOINC clinical measurements as biolink:ClinicalMeasurement nodes, with edges to ChEBI/UBERON/CL/PR/NCBITaxon (OMOP2OBO) and HPO (loinc2hpo).
      sources: [infores:loinc, infores:omop2obo, infores:comploinc]
      produces: [ClinicalMeasurement, Association]
      files: [loinc_nodes_nodes.tsv, loinc_parts_nodes.tsv, loinc_composition_edges.tsv, loinc_hierarchy_edges.tsv, loinc_phenotype_edges.tsv]
      code_license: MIT
      in_monarch_kg: true
    mmrrc:
      repo: monarch-initiative/mmrrc-ingest
      name: MMRRC
      covers: mutant mouse genotypes and phenotypes
      description: Monarch Initiative data ingest for MMRRC (Mutant Mouse Resource & Research Centers) - capturing allele to genotype associations, genotype nodes, and genotype to phenotype associations
      sources: [infores:mmrrc]
      produces: [Genotype, GenotypeToGeneAssociation, GenotypeToPhenotypicFeatureAssociation, GenotypeToVariantAssociation]
      files: [mmrrc_allele_to_genotype_edges.tsv, mmrrc_genotype_nodes.tsv, mmrrc_genotype_to_gene_edges.tsv, mmrrc_genotype_to_phenotype_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    ncbi_gene:
      repo: monarch-initiative/ncbi-gene
      name: NCBI Gene
      covers: genes of dog, cattle, pig, chicken and Aspergillus nidulans
      description: Ingest of genes from NCBI
      sources: [infores:ncbi-gene]
      produces: [Gene]
      files: [ncbi_gene_9615_nodes.tsv, ncbi_gene_9913_nodes.tsv, ncbi_gene_9823_nodes.tsv, ncbi_gene_9031_nodes.tsv, ncbi_gene_227321_nodes.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
      note: One file per taxon; the release has more taxa than the five the Monarch KG takes (dog, cattle, pig, chicken, Aspergillus nidulans).
    omim:
      repo: monarch-initiative/omim-ingest
      name: OMIM
      covers: gene-to-disease associations
      description: OMIM gene to disease associations
      sources: [infores:omim]
      produces: [CausalGeneToDiseaseAssociation, CorrelatedGeneToDiseaseAssociation]
      files: [omim_gene_to_disease_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
      note: Its released edges are public; rerunning the transform needs an OMIM download key.
    panther:
      repo: monarch-initiative/pantherdb-orthologs-ingest
      name: PANTHER
      covers: orthologs
      description: Ortholog ingest from PantherDB - transforms gene orthology relationships into Biolink model format
      sources: [infores:panther, infores:ncbi-gene]
      produces: [GeneToGeneHomologyAssociation]
      files: [panther_genome_orthologs_edges.tsv]
      code_license: MIT
      in_monarch_kg: true
    phenopacket:
      repo: monarch-initiative/phenopacket-ingest
      name: Phenopacket Store
      covers: case reports
      description: Ingesting phenopackets into the Monarch KG
      sources: [infores:phenopacket-store]
      produces: [Case, CaseToDiseaseAssociation, CaseToGeneAssociation, CaseToPhenotypicFeatureAssociation, CaseToVariantAssociation]
      files: [phenopacket_ingest_nodes.tsv, phenopacket_ingest_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    pombase:
      repo: monarch-initiative/pombase-ingest
      name: PomBase
      covers: fission yeast genes and phenotypes
      description: PomBase gene and phenotype ingest
      sources: [infores:pombase]
      produces: [Gene, GeneToPhenotypicFeatureAssociation]
      files: [pombase_gene_nodes.tsv, pombase_gene_to_phenotype_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    reactome:
      repo: monarch-initiative/reactome-ingest
      name: Reactome
      covers: pathways, their genes and chemicals
      description: Koza ingest for Reactome pathway data
      sources: [infores:reactome]
      produces: [Pathway, GeneToPathwayAssociation, ChemicalEntityToPathwayAssociation]
      files: [reactome_pathway_nodes.tsv, reactome_gene_to_pathway_edges.tsv, reactome_chemical_to_pathway_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    string:
      repo: monarch-initiative/string-ingest
      name: STRING
      covers: protein-protein links
      description: STRING DB protein links ingest
      sources: [infores:string]
      produces: [PairwiseGeneToGeneInteraction]
      files: [string_protein_links_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    upheno:
      repo: monarch-initiative/upheno-cross-species-ingest
      name: uPheno
      covers: phenotypes matched across species
      description: An automated ingest transforming the upheno data artifact upheno-cross-species.sssom.tsv into KGX.
      sources: [infores:upheno]
      produces: [PhenotypicFeature, Association]
      files: [upheno_phenotype_to_phenotype_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    xenbase:
      repo: monarch-initiative/xenbase-ingest
      name: Xenbase
      covers: Xenopus phenotypes and orthologs
      description: Xenbase gene to phenotype and orthology ingests
      sources: [infores:xenbase, infores:monarchinitiative-xpo-spo]
      produces: [Gene, PhenotypicFeature, GeneToPhenotypicFeatureAssociation, GeneToGeneHomologyAssociation]
      files: [xenbase_gene_to_phenotype_edges.tsv, xenbase_orthologs_edges.tsv, xenbase_non_entrez_orthologs_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    zfin:
      repo: monarch-initiative/zfin-ingest
      name: ZFIN
      covers: zebrafish phenotypes and orthologs
      description: ZFIN gene-to-phenotype, genotype-to-phenotype, and orthology ingests
      sources: [infores:zfin, infores:zp]
      produces: [GeneToPhenotypicFeatureAssociation, GenotypeToPhenotypicFeatureAssociation, GeneToGeneHomologyAssociation]
      files: [zfin_gene_to_phenotype_edges.tsv, zfin_genotype_to_phenotype_edges.tsv, zfin_orthology_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: true
    ctd:
      repo: monarch-initiative/ctd-ingest
      name: CTD
      covers: chemical-to-disease associations
      description: CTD chemical to disease association ingest
      sources: [infores:ctd]
      produces: [ChemicalEntityToDiseaseOrPhenotypicFeatureAssociation]
      files: [ctd_chemical_to_disease_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: false
      note: Removed from the Monarch KG build on 2026-07-14 (monarch-ingest f8f0b3ff); still released monthly.
    medic:
      repo: monarch-initiative/medic-ingest
      name: MeDIC
      covers: drug-to-disease indications
      description: Koza ingest for drug-to-disease edges from MeDIC
      sources: [infores:medic, infores:mondo, infores:sri-node-normalizer]
      produces: [ChemicalOrDrugOrTreatmentToDiseaseOrPhenotypicFeatureAssociation]
      files: [medic_indication_nodes.tsv, medic_indication_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: false
      note: Removed from the Monarch KG build on 2026-07-14 (monarch-ingest f8f0b3ff); still released monthly.
    maxo:
      repo: monarch-initiative/maxo-annotation-ingest
      name: MAxO annotations
      covers: treatments for diseases and phenotypes
      description: Transform of MAxO Annotations into Biolink Model compliant KGX
      sources: [infores:maxo-annotations]
      produces: [ChemicalOrDrugOrTreatmentToDiseaseOrPhenotypicFeatureAssociation]
      files: [maxo_annotation_edges.tsv]
      code_license: BSD-3-Clause
      in_monarch_kg: false
      note: Removed from the Monarch KG build on 2026-04-14 (monarch-ingest 8af41646); its last release is from 2026-08-03.

ingests:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    Structured data ingests to draw records from, if any; most Mechs need
    none. Each is a Monarch Initiative ingest: one source, already turned
    into KGX nodes and edges and released monthly. `just ingest <name>`
    fetches a release, checks its files against their published checksums,
    and locks the version in conf/ingests.lock.yaml. Rows seed records and
    point to evidence; they are not quotes. Change later in conf/ingests.yaml
  multiselect: true
  choices:
    "Alliance of Genome Resources: genes, alleles, genotypes, expression, phenotypes, disease": alliance
    "Bgee: gene expression by anatomy": bgee
    "BioGRID: gene-to-gene interactions": biogrid
    "ClinGen: gene-disease validity and variants": clingen
    "ClinVar: variants and their genes and diseases": clinvar
    "CURE ID: drug repurposing case reports": cureid
    "dictyBase: Dictyostelium genes and phenotypes": dictybase
    "Gene Ontology annotations: gene functions, processes, locations (1.1 GB)": go
    "HGNC: human genes": hgnc
    "HPO annotations: disease and gene phenotypes, inheritance": hpoa
    "LOINC: clinical measurements": loinc
    "MMRRC: mutant mouse genotypes and phenotypes": mmrrc
    "NCBI Gene: genes of dog, cattle, pig, chicken and Aspergillus nidulans": ncbi_gene
    "OMIM: gene-to-disease associations": omim
    "PANTHER: orthologs": panther
    "Phenopacket Store: case reports": phenopacket
    "PomBase: fission yeast genes and phenotypes": pombase
    "Reactome: pathways, their genes and chemicals": reactome
    "STRING: protein-protein links": string
    "uPheno: phenotypes matched across species": upheno
    "Xenbase: Xenopus phenotypes and orthologs": xenbase
    "ZFIN: zebrafish phenotypes and orthologs": zfin
    "CTD: chemical-to-disease associations (not in the Monarch KG)": ctd
    "MeDIC: drug-to-disease indications (not in the Monarch KG)": medic
    "MAxO annotations: treatments for diseases and phenotypes (not in the Monarch KG)": maxo
  default: []

koza_ingests:
  type: bool
  when: "{{ kind == 'mech' }}"
  help: >-
    Add Koza, for the Mech's own ingests: a source with no ingest above
    becomes a folder under ingests/ (its download list, a Koza transform
    config and its Python), and `just ingest <name>` downloads it, runs the
    transform and records every file's checksum. Adds koza and
    kghub-downloader. Not needed to use the ingests picked above
  default: false

# Whether the Mech has any structured data ingest: picked, or its own.
uses_ingests:
  type: bool
  when: false
  default: "{{ kind == 'mech' and (ingests | length > 0 or koza_ingests) }}"

output_formats:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    Formats `just export` writes and checks, and releases attach. All come
    from LinkML. JSON-LD and Turtle are RDF: they are only as good as the
    schema's prefixes and URIs, which the design step must declare. Change
    later in conf/export.yaml
  multiselect: true
  choices:
    "YAML, the curated files (zip)": yaml
    "JSON and JSON Lines": json
    "JSON-LD (RDF)": jsonld
    "Turtle (RDF)": ttl
    "SQLite database": sqlite
    "DuckDB database (adds linkml-store and its dependencies)": duckdb
    "Parquet: one file per class, as in the SQL export (adds pyarrow)": parquet
    "KGX, an edge from each record to each term it binds": kgx
    "KGX, the whole record graph as nodes and edges": kgx_maximal
    "SQL: schema DDL, and the data as SQL": sql
    "CSV": csv
    "TSV": tsv
  default: [yaml, json, jsonld, ttl, sqlite, sql, csv]
  validator: "{% if not output_formats %}Pick at least one format.{% endif %}"

kgx_biolink:
  type: bool
  help: >-
    Map the KGX export onto the Biolink model, and check it against
    Biolink (adds biolink-model). Biolink is biomedical; say no when its
    classes and predicates do not fit the domain, and the graph uses the
    Mech's own categories and predicates instead. Change later in
    conf/kgx.yaml
  default: true
  when: "{{ kind == 'mech' and ('kgx' in output_formats or 'kgx_maximal' in output_formats) }}"

load_targets:
  type: str
  when: "{{ kind == 'mech' }}"
  help: >-
    Running databases `just load` can fill with the records, through
    linkml-store: MongoDB (one collection) and Neo4j (a graph of every
    object). Each adds linkml-store to the Mech. Addresses go in
    conf/load.yaml, with passwords read from the environment
  multiselect: true
  choices:
    "MongoDB": mongodb
    "Neo4j (a graph of every object)": neo4j
  default: []

tabular_layout:
  type: str
  help: >-
    How CSV and TSV hold nested data. One table per class, linked by ids, as
    in the SQL export; or one row per record, with nested values as JSON
  choices:
    "One table per class (normalized)": per_class
    "One row per record (flattened)": flat
  default: per_class
  when: "{{ kind == 'mech' and ('csv' in output_formats or 'tsv' in output_formats) }}"

python_min:
  type: str
  help: Minimum Python version
  choices: ["3.11", "3.12", "3.13"]
  default: "3.11"

# ---------------------------------------------------------------- computed

# The links a Fleet member's records make, with names filled in. The
# templates read this, never fleet_links directly.
fleet_link_selection:
  type: yaml
  when: false
  default: >-
    {%- set sel = [] -%}
    {%- if kind == 'mech' and fleet_name -%}
    {%- for x in fleet_links if x is mapping -%}
    {%- set cls = x['class'] | default(x.target ~ 'Link') | string -%}
    {%- set _ = sel.append({
      "slot": x.slot | string, "target": x.target | string, "prefix": x.prefix | string,
      "uri": x.uri | default('https://w3id.org/' ~ github_org ~ '/' ~ x.prefix ~ '/') | string,
      "class": cls, "relation_enum": cls ~ 'RelationEnum', "basis_enum": cls ~ 'BasisEnum',
      "relations": x.relations, "bases": x.bases | default({}),
      "description": x.description | default('Links to ' ~ x.target ~ ' records.') | string}) -%}
    {%- endfor -%}
    {%- endif -%}
    {{ sel | tojson }}

uses_agents:
  type: bool
  when: false
  default: "{{ workflows | select('in', agent_workflows) | list | length > 0 }}"

# Whether any adapter reads a file in the repository (BioPortal is uses_bioportal).
local_ontology_files:
  type: bool
  when: false
  default: >-
    {%- set ns = namespace(hit=false) -%}
    {%- set adapters = ontology_selection | map(attribute='adapter') | list -%}
    {%- if identity_prefix %}{% set adapters = adapters + [identity_adapter] %}{% endif -%}
    {%- for a in adapters -%}
    {%- if a.split(':')[0] in ['simpleobo', 'pronto', 'obograph', 'sqlite'] and not a.startswith('sqlite:obo:') -%}
    {%- set ns.hit = true -%}
    {%- endif -%}
    {%- endfor -%}
    {{ ns.hit }}

uses_bioportal:
  type: bool
  when: false
  default: >-
    {%- set ns = namespace(hit=false) -%}
    {%- set adapters = ontology_selection | map(attribute='adapter') | list -%}
    {%- if identity_prefix %}{% set adapters = adapters + [identity_adapter] %}{% endif -%}
    {%- for a in adapters if a.startswith('bioportal:') %}{% set ns.hit = true %}{% endfor -%}
    {{ ns.hit }}
