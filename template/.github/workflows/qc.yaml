name: QC

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - name: Install
        run: just install
      - name: Offline gates
        run: just qc
      # Term and quote checks read the committed caches first and go to the
      # network only for what the caches lack.
      - name: Ontology terms
        run: just validate-terms-all
      - name: Verbatim quotes
        run: just validate-references-all
