# How `just export` writes KGX (formats kgx and kgx_maximal in
# conf/export.yaml). See src/goatmech/kgx.py.
#
# kgx: one Biolink association per term a record's section binds, from the
#   record to the term, with the section's predicate. Evidence goes on the
#   edge: references in `publications`, quotes in `supporting_text`.
# kgx_maximal: every object in a record is a node, every field holding
#   objects an edge (goatmech:<field>); term nodes take the
#   categories below.
#
# Every category and predicate is checked against the Biolink model. A
# predicate whose Biolink domain or range does not fit the categories is
# reported as a warning. Start from biolink:related_to, and choose a more
# specific predicate only where its meaning holds for every record: the
# design-mech-schema skill says how.

# The Biolink category of a record. VBO places breeds under NCBITaxon.
record_category: biolink:OrganismTaxon

# Provenance on every edge.
knowledge_source: infores:goatmech
knowledge_level: knowledge_assertion
agent_type: manual_validation_of_automated_agent

# Record sections whose items bind an ontology term: the predicate from the
# record to the term, the term's category, and the item's field that holds
# the term (default `term`; an item that is itself a term needs none).
sections:
  origins:
    predicate: biolink:related_to
    category: biolink:GeographicLocation
  distinguishing_features:
    predicate: biolink:related_to
    category: biolink:NamedThing
  measurements:
    predicate: biolink:related_to
    category: biolink:NamedThing
    term_field: trait
  related_breeds:
    predicate: biolink:related_to
    category: biolink:OrganismTaxon
    term_field: breed
