name: Test template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv tool install rust-just
      - run: just install
      - run: just lint
      - run: just test
      - run: just docs-build
      - run: just test-generated
