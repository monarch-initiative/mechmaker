id: datmech:43604
name: 43604 Toledo, Ohio
description: ZIP code 43604 is downtown Toledo, Ohio. The city's Collins Park plant treats Lake Erie water for about 500,000 people in and around Toledo. In August 2014 microcystin from harmful algal blooms in Lake Erie reached the city's water, and residents were told not to use it.
description_evidence:
  - reference: url:https://toledo.oh.gov/departments/public-utilities/water-treatment
    reference_title: City of Toledo | Water Treatment
    supports: SUPPORT
    evidence_source: UTILITY_RECORD
    snippet: The city of Toledo supplies water to a population of approximately 500,000 people located in the city and surrounding areas including parts of Lucas, Wood, and Fulton Counties, and south Monroe County in Michigan.
  - reference: WIKIPEDIA:Microcystin
    reference_title: Microcystin
    supports: SUPPORT
    evidence_source: ENCYCLOPEDIA
    snippet: In August 2014, the City of Toledo, Ohio detected unsafe levels of microcystin in its water supply due to harmful algal blooms in Lake Erie
status: PROPOSED
