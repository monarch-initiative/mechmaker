discussions:
  - discussion_id: omim-ingest-species
    prompt: The README lists no species by NCBITaxon id. Curate the species the ingest takes data for.
    kind: CURATION_TODO
    status: RESOLVED
    attaches_to:
      - organisms
    resolved_date: '2026-09-30'
    resolution_note: Homo sapiens, from the README's description of OMIM.
  - discussion_id: omim-ingest-data-licenses
    prompt: The terms OMIM's data is under are not recorded.
    kind: KNOWLEDGE_GAP
    status: OPEN
    attaches_to:
      - upstream_sources
    rationale: OMIM's terms page, https://www.omim.org/help/agreement, answered 403 to scripted requests on 2026-09-30, and neither the ingest nor OMIM's paper states the terms. A person with an OMIM account can read them and record them here.
