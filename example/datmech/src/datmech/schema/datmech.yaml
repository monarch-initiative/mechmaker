id: https://w3id.org/monarch-initiative/datmech
name: datmech
title: Drainage and Treatment Knowledge Base
description: >-
  DaTMech records US ZIP code areas by their water: the watersheds they drain to, the plants that treat their drinking water and wastewater, and the incidents that have harmed its safety or quality, with every claim quoted from its source.
license: CC-BY-4.0
see_also:
  - https://github.com/monarch-initiative/datmech

# One record is one US ZIP code area: where its water drains, where it is
# treated, and what has gone wrong with it. docs/DOMAIN.md says what that
# means, where each section comes from, and how curation_priority follows
# from incidents.

prefixes:
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  skos: http://www.w3.org/2004/02/skos/core#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  schema: http://schema.org/
  datmech: https://w3id.org/monarch-initiative/datmech/
  PMID: http://www.ncbi.nlm.nih.gov/pubmed/
  DOI: https://doi.org/
  WIKIPEDIA: https://en.wikipedia.org/wiki/
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_

default_prefix: datmech
default_range: string

imports:
  - linkml:types
  - mech_shared

# ============================================================ classes

classes:

  ZipArea:
    tree_root: true
    description: >-
      One US ZIP code area, meaning the Census ZIP Code Tabulation Area
      (ZCTA) for the code: where its water drains, where its drinking water
      and wastewater are treated, and the incidents that harmed its water.
      One record lives in one YAML file under data/zip_areas/.
    slots:
      - id
      - name
      - description
      - description_evidence
      - synonyms
      - status
      - place_name
      - state
      - curation_priority
      - zcta
      - watersheds
      - treatment_facilities
      - incidents
      - evidence
      - datasets
      - discussions
      - notes
      - creation_date
      - updated_date
      - curation_history
    slot_usage:
      id:
        description: >-
          datmech: and the five-digit ZIP code, e.g. datmech:48502. The id
          is the ZIP code; no other field repeats it.
        pattern: "^datmech:[0-9]{5}$"
      name:
        required: true
        description: >-
          The ZIP code and the place the Postal Service names for it, e.g.
          48502 Flint, Michigan.
      description:
        recommended: true

  Zcta:
    description: >-
      The Census ZIP Code Tabulation Area for the record's ZIP code: the area
      the record means. From Census TIGERweb, quoted from the query's JSON.
    slots:
      - vintage
      - interior_latitude
      - interior_longitude
      - land_area_m2
      - water_area_m2
      - evidence
    slot_usage:
      vintage:
        required: true
        description: The census the ZCTA comes from, e.g. 2020.
      interior_latitude:
        description: Latitude of the ZCTA's interior point (INTPTLAT), WGS84.
      interior_longitude:
        description: Longitude of the ZCTA's interior point (INTPTLON), WGS84.

  Watershed:
    class_uri: ENVO:00000291
    description: >-
      A USGS hydrologic unit the ZIP area lies in: a drainage basin (ENVO
      drainage basin). Named by its Hydrologic Unit Code from the Watershed
      Boundary Dataset.
    slots:
      - huc
      - name
      - water_bodies
      - water_quality_portal
      - evidence
      - notes
    slot_usage:
      name:
        required: true
        description: The Watershed Boundary Dataset's name for the unit, e.g. Gilkey Creek-Flint River.

  TreatmentFacility:
    description: >-
      A plant that treats the ZIP area's drinking water or its wastewater,
      inside the area or not. A water system that buys treated water names
      its sellers in purchased_from.
    slots:
      - name
      - facility_type
      - operator
      - system_id
      - service_status
      - source_type
      - source_waters
      - purchased_from
      - receiving_waters
      - description
      - evidence
      - notes
    slot_usage:
      name:
        required: true
        description: The facility's name as its operator or EPA gives it.
      description:
        description: What the facility does for this ZIP area, in a sentence.

  Incident:
    description: >-
      An event that harmed, or threatened, the safety or quality of the ZIP
      area's water: a contamination, a treatment failure, a spill, a toxic
      bloom, an outbreak. Its dates and numbers are quoted from sources.
    slots:
      - name
      - incident_kind
      - start_date
      - end_date
      - description
      - cause
      - processes
      - contaminants
      - organisms
      - affected_waters
      - affected_facilities
      - advisories
      - evidence
      - notes
    slot_usage:
      name:
        required: true
        description: The incident's common name, e.g. Flint water crisis.
      description:
        description: What happened, in a sentence or two.

  Advisory:
    description: >-
      A notice to the public about the water during an incident: boil it, do
      not drink it, use bottled water; or a declared emergency.
    slots:
      - advisory_kind
      - issued_by
      - start_date
      - end_date
      - population_affected
      - description
      - evidence

  Term:
    description: A reference to an ontology term. The label must match the ontology.
    slots:
      - id
      - label
    slot_usage:
      label:
        required: true

  Descriptor:
    abstract: true
    description: >-
      A curated mention of something, with a human-readable preferred term, an
      optional ontology binding, and evidence. The preferred term may be more
      specific than the bound term when the ontology lacks the needed
      granularity. Never bind a guessed CURIE; leave `term` empty instead.
    slots:
      - preferred_term
      - term
      - description
      - evidence
      - notes

  ChemicalEntityDescriptor:
    is_a: Descriptor
    description: A contaminant or other chemical entity, bindable to CHEBI.
    slot_usage:
      term:
        bindings:
          - binds_value_of: id
            range: ChemicalEntityTerm
            obligation_level: REQUIRED

  OrganismDescriptor:
    is_a: Descriptor
    description: An organism in an incident (a pathogen, a toxin producer), bindable to NCBITaxon.
    slot_usage:
      term:
        bindings:
          - binds_value_of: id
            range: OrganismTerm
            obligation_level: REQUIRED

  WaterBodyDescriptor:
    is_a: Descriptor
    description: >-
      A named river, lake, creek or other water body, with its kind bound to
      ENVO under water body. preferred_term is the name (Flint River); term
      is the kind (river). An aquifer is not under water body in ENVO: leave
      term empty for one and say so in notes.
    slot_usage:
      term:
        bindings:
          - binds_value_of: id
            range: WaterBodyTerm
            obligation_level: REQUIRED

  EnvironmentalProcessDescriptor:
    is_a: Descriptor
    description: >-
      What happened to the water in an incident, as an environmental process
      bound to ENVO, e.g. water pollution.
    slot_usage:
      term:
        bindings:
          - binds_value_of: id
            range: EnvironmentalProcessTerm
            obligation_level: REQUIRED

  EvidenceItem:
    description: >-
      A citation that bears on a claim, with a verbatim quote from the source.
      The quote is checked against the cached source text by
      linkml-reference-validator. A paraphrase fails.
    slots:
      - reference
      - reference_title
      - supports
      - evidence_source
      - snippet
      - explanation

  CurationEvent:
    description: >-
      One change to this record, appended and never edited. The repository
      level history/ layer records the session; this records the change on the
      record itself.
    slots:
      - timestamp
      - curator
      - llm_assisted
      - model
      - action
      - description

# ============================================================ slots

slots:
  id:
    identifier: true
    range: uriorcurie
    description: A CURIE.
  name:
    slot_uri: schema:name
    description: Preferred human-readable name.
  label:
    slot_uri: rdfs:label
    description: >-
      The ontology's own label for the term. Checked by linkml-term-validator.
  description:
    slot_uri: dcterms:description
    description: Free-text description.
  notes:
    description: Curator notes. Paraphrase belongs here, never in a snippet.
  synonyms:
    slot_uri: skos:altLabel
    multivalued: true
    description: Other names in use.
  status:
    range: CurationStatusEnum
    description: Review state. DRAFT, then PROPOSED when complete and valid; only a person sets REVIEWED.
  preferred_term:
    required: true
    description: The preferred human-readable term for this descriptor.
  term:
    range: Term
    inlined: true
    recommended: true
    description: Ontology term binding. Leave empty rather than guess.
  place_name:
    recommended: true
    description: The place the Postal Service names for the ZIP code, e.g. Flint.
  state:
    recommended: true
    pattern: "^[A-Z]{2}$"
    description: >-
      Two-letter Postal Service code of the state, e.g. MI. Required once
      the record leaves DRAFT (validate.py).
  curation_priority:
    range: CurationPriorityEnum
    recommended: true
    description: >-
      How urgently the record needs curating, set from its incidents by the
      rule in docs/DOMAIN.md and checked by validate.py. Required once the
      record leaves DRAFT.
  zcta:
    range: Zcta
    inlined: true
    recommended: true
    description: The Census ZCTA the record means.
  vintage:
    range: integer
    description: The year of the census a geography comes from.
  interior_latitude:
    range: float
    description: Latitude in decimal degrees, WGS84.
  interior_longitude:
    range: float
    description: Longitude in decimal degrees, WGS84.
  land_area_m2:
    range: integer
    description: Land area in square meters (ALAND).
  water_area_m2:
    range: integer
    description: Water area in square meters (AWATER).
  watersheds:
    range: Watershed
    multivalued: true
    inlined_as_list: true
    description: The USGS hydrologic units the ZIP area lies in, from HUC8 down to HUC12.
  huc:
    required: true
    pattern: "^([0-9]{2}){1,6}$"
    description: >-
      Hydrologic Unit Code, 2 to 12 digits. Its length is its level: 8
      digits a subbasin (HUC8), 12 a subwatershed (HUC12).
  water_bodies:
    range: WaterBodyDescriptor
    multivalued: true
    inlined_as_list: true
    description: The main rivers and lakes of the watershed.
  water_quality_portal:
    range: uri
    description: >-
      The Water Quality Portal's monitoring locations in this watershed, a
      Station search by HUC, e.g.
      https://www.waterqualitydata.us/wqx3/Station/search?huc=04080204&mimeType=csv
  treatment_facilities:
    range: TreatmentFacility
    multivalued: true
    inlined_as_list: true
    description: The plants that treat the ZIP area's drinking water and its wastewater.
  facility_type:
    range: Term
    inlined: true
    required: true
    description: >-
      What kind of plant, bound to ENVO under industrial building:
      drinking water treatment plant (ENVO:03600004) or wastewater
      treatment plant (ENVO:00002043).
    bindings:
      - binds_value_of: id
        range: TreatmentFacilityTerm
        obligation_level: REQUIRED
  operator:
    description: The utility or government that runs the facility.
  system_id:
    pattern: "^[A-Z]{2}[0-9A-Z]{7}$"
    description: >-
      EPA identifier: the PWSID of a public water system (MI0002310) or
      the NPDES permit of a discharger (MI0022926).
  service_status:
    range: ServiceStatusEnum
    description: Whether the facility serves the ZIP area now.
  source_type:
    range: SourceTypeEnum
    description: Where a drinking water system's water comes from, as EPA's SDWIS classes it.
  source_waters:
    range: WaterBodyDescriptor
    multivalued: true
    inlined_as_list: true
    description: The water bodies a drinking water plant draws from.
  purchased_from:
    multivalued: true
    description: >-
      The systems a drinking water system buys treated water from, by name
      and PWSID as EPA gives them, e.g. GREAT LAKES WATER AUTHORITY (MI0002838).
  receiving_waters:
    range: WaterBodyDescriptor
    multivalued: true
    inlined_as_list: true
    description: The water bodies a wastewater plant discharges to.
  incidents:
    range: Incident
    multivalued: true
    inlined_as_list: true
    description: Events that harmed, or threatened, the safety or quality of the ZIP area's water.
  incident_kind:
    range: IncidentKindEnum
    required: true
    description: What kind of incident.
  start_date:
    pattern: "^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$"
    description: When it began, as precisely as the source says (YYYY, YYYY-MM or YYYY-MM-DD).
  end_date:
    pattern: "^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$"
    description: When it ended or was lifted, as precisely as the source says. Empty if ongoing or unknown.
  cause:
    description: Why it happened, in prose, as the sources explain it.
  processes:
    range: EnvironmentalProcessDescriptor
    multivalued: true
    inlined_as_list: true
    description: What happened to the water, as ENVO processes.
  contaminants:
    range: ChemicalEntityDescriptor
    multivalued: true
    inlined_as_list: true
    description: Chemicals that contaminated the water, bound to CHEBI.
  organisms:
    range: OrganismDescriptor
    multivalued: true
    inlined_as_list: true
    description: Organisms in the incident, bound to NCBITaxon.
  affected_waters:
    range: WaterBodyDescriptor
    multivalued: true
    inlined_as_list: true
    description: Natural water bodies the incident reached.
  affected_facilities:
    multivalued: true
    description: Names of the record's treatment_facilities the incident involved.
  advisories:
    range: Advisory
    multivalued: true
    inlined_as_list: true
    description: Notices to the public about the water during the incident.
  advisory_kind:
    range: AdvisoryKindEnum
    required: true
    description: What the public was told.
  issued_by:
    description: Who issued the advisory or declared the emergency.
  population_affected:
    range: integer
    description: How many people it covered, when a source gives a number.
  evidence:
    range: EvidenceItem
    multivalued: true
    inlined_as_list: true
    recommended: true
    description: Citations that bear on the enclosing claim.
  description_evidence:
    range: EvidenceItem
    multivalued: true
    inlined_as_list: true
    recommended: true
    description: >-
      Quotes for the facts stated in the record's description. Every fact
      there needs one, here or in the section that states it with evidence.
  datasets:
    range: Dataset
    multivalued: true
    inlined_as_list: true
    description: Public datasets relevant to this record (mech_shared).
  discussions:
    range: Discussion
    multivalued: true
    inlined_as_list: true
    description: Open questions, knowledge gaps and curation to-dos (mech_shared).
  reference:
    description: The cited source, as a CURIE such as PMID:12345678 or DOI:10.1000/xyz.
    pattern: "^[A-Za-z][A-Za-z0-9_]*:[^\\s]+$"
    required: true
    implements:
      - linkml:authoritative_reference
  reference_title:
    description: Title of the cited source. Filled from the reference cache by `just add-evidence` and `just fill-titles`.
    recommended: true
  supports:
    range: EvidenceSupportEnum
    required: true
    description: Which way the evidence cuts relative to the claim.
  evidence_source:
    range: EvidenceSourceEnum
    description: The kind of system the evidence comes from.
  snippet:
    description: >-
      An exact quote from the cited source. Checked verbatim against the cached
      source text. Paraphrase goes in `explanation`.
    implements:
      - linkml:excerpt
  explanation:
    description: How the quote bears on the claim.
  creation_date:
    range: date
    description: Date the record was created. Stable after first set.
  updated_date:
    range: date
    description: Date of the last substantive change.
  curation_history:
    range: CurationEvent
    multivalued: true
    inlined_as_list: true
    description: Append-only list of changes to this record.
  timestamp:
    range: datetime
    required: true
    description: ISO-8601 time of the change.
  curator:
    required: true
    description: GitHub login of the person, or harness name of the agent.
  llm_assisted:
    range: boolean
    description: True when a model produced or edited the content.
  model:
    description: Model identifier when llm_assisted is true.
  action:
    range: CurationActionEnum
    required: true
    description: What kind of change this was.

# ============================================================ enums

enums:
  CurationStatusEnum:
    description: Review state of a record.
    permissible_values:
      DRAFT:
        description: Incomplete. Not ready for review.
      PROPOSED:
        description: Complete and validated, awaiting human review.
      REVIEWED:
        description: A person reviewed and accepted it. Only a person sets this.
      DEPRECATED:
        description: Kept for provenance. Not current.

  EvidenceSupportEnum:
    description: Direction of an evidence item relative to its claim.
    permissible_values:
      SUPPORT:
        description: The source supports the claim.
      REFUTE:
        description: The source contradicts the claim.
      PARTIAL:
        description: The source supports the claim in part or with caveats.
      NO_EVIDENCE:
        description: The source is relevant but does not bear on the claim.
      WRONG_STATEMENT:
        description: The cited statement was found to be wrong. Kept for provenance.

  EvidenceSourceEnum:
    description: Where the evidence comes from.
    permissible_values:
      GOVERNMENT_RECORD:
        description: A page, report or order from a government agency (EPA, a state, a city).
      GEOSPATIAL_DATASET:
        description: A Census or USGS geographic dataset, such as TIGERweb or the Watershed Boundary Dataset.
      MONITORING_DATA:
        description: Measurements, such as the Water Quality Portal's.
      UTILITY_RECORD:
        description: A utility's own page or report.
      ENCYCLOPEDIA:
        description: Wikipedia or another encyclopedia.
      NEWS:
        description: A news article.
      PUBLICATION:
        description: A peer-reviewed paper.
      OTHER:
        description: Anything else; say what in the explanation.

  CurationActionEnum:
    description: Kind of change recorded in a CurationEvent.
    permissible_values:
      CREATE:
      EDIT:
      REVIEW:
      DEPRECATE:

  ChemicalEntityTerm:
    description: "A chemical entity term, descending from CHEBI:24431 (chemical entity)."
    reachable_from:
      source_nodes:
        - CHEBI:24431  # chemical entity
      is_direct: false
      include_self: true
      relationship_types:
        - rdfs:subClassOf

  OrganismTerm:
    description: "An organism term, descending from NCBITaxon:1 (root)."
    reachable_from:
      source_nodes:
        - NCBITaxon:1  # root
      is_direct: false
      include_self: true
      relationship_types:
        - rdfs:subClassOf

  WaterBodyTerm:
    description: "A kind of water body, descending from ENVO:00000063 (water body)."
    reachable_from:
      source_nodes:
        - ENVO:00000063  # water body
      is_direct: false
      include_self: true
      relationship_types:
        - rdfs:subClassOf

  TreatmentFacilityTerm:
    description: >-
      A kind of treatment plant, descending from ENVO:00003861 (industrial
      building), which holds both drinking water treatment plant and
      wastewater treatment plant.
    reachable_from:
      source_nodes:
        - ENVO:00003861  # industrial building
      is_direct: false
      include_self: true
      relationship_types:
        - rdfs:subClassOf

  EnvironmentalProcessTerm:
    description: "An environmental process, descending from ENVO:02500000 (environmental system process)."
    reachable_from:
      source_nodes:
        - ENVO:02500000  # environmental system process
      is_direct: false
      include_self: true
      relationship_types:
        - rdfs:subClassOf

  CurationPriorityEnum:
    description: How urgently a ZIP area needs curating, set from its incidents (docs/DOMAIN.md).
    permissible_values:
      HIGH:
        description: At least one incident with a public advisory or a declared emergency.
      MEDIUM:
        description: At least one incident, none with an advisory.
      LOW:
        description: Searched, and no incident found.
      UNASSESSED:
        description: Not searched yet.

  ServiceStatusEnum:
    description: Whether a facility serves the ZIP area now.
    permissible_values:
      CURRENT:
        description: Serves the area now.
      BACKUP:
        description: Kept ready to serve the area if the current supply fails.
      FORMER:
        description: Served the area once and does not now.

  SourceTypeEnum:
    description: A drinking water system's primary source, as EPA's SDWIS classes it.
    permissible_values:
      SURFACE_WATER:
        description: Draws from rivers, lakes or reservoirs (SDWIS SW).
      GROUNDWATER:
        description: Draws from wells (SDWIS GW).
      PURCHASED_SURFACE_WATER:
        description: Buys treated surface water from another system (SDWIS SWP).
      PURCHASED_GROUNDWATER:
        description: Buys treated groundwater from another system (SDWIS GWP).
      GROUNDWATER_UNDER_INFLUENCE:
        description: Groundwater under the direct influence of surface water (SDWIS GU).

  IncidentKindEnum:
    description: What kind of incident harmed the water.
    permissible_values:
      CONTAMINATION:
        description: A contaminant got into drinking water through the system itself, such as lead from pipes.
      TREATMENT_FAILURE:
        description: Treatment did not make the water safe, such as a disinfection lapse.
      SPILL:
        description: A chemical or fuel released into the environment reached the water.
      TOXIC_BLOOM:
        description: A bloom of algae or cyanobacteria made toxins in the source water.
      OUTBREAK:
        description: A waterborne disease outbreak.
      INFRASTRUCTURE_FAILURE:
        description: A main break, a plant failure or a loss of pressure.
      OTHER:
        description: Anything else; say what in the description.

  AdvisoryKindEnum:
    description: What the public was told about the water.
    permissible_values:
      BOIL_WATER:
        description: Boil water before drinking it.
      DO_NOT_DRINK:
        description: Do not drink the water, boiled or not.
      DO_NOT_USE:
        description: Do not use the water at all.
      BOTTLED_WATER:
        description: Use bottled water, as a recommendation or by distribution.
      EMERGENCY_DECLARATION:
        description: A government declared an emergency over the water.
      NO_CONTACT:
        description: Avoid contact with a water body (swimming, wading, fishing), as after a sewage release or a toxic bloom.
      OTHER:
        description: Any other notice; say what in the description.
