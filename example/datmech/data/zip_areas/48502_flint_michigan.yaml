incidents:
  - name: Flint water crisis
    incident_kind: CONTAMINATION
    start_date: 2014-04
    end_date: '2019'
    description: Flint's drinking water was contaminated with lead after the city changed its source to the Flint River, exposing around 100,000 residents.
    cause: The new source water was not given corrosion control, so lead leached from aging pipes.
    processes:
      - preferred_term: lead leaching into drinking water
        term:
          id: ENVO:02500039
          label: water pollution
        evidence:
          - reference: WIKIPEDIA:Flint_water_crisis
            reference_title: Flint water crisis
            supports: SUPPORT
            evidence_source: ENCYCLOPEDIA
            snippet: Officials failed to apply corrosion inhibitors to the water, which resulted in lead from aging pipes leaching into the water supply, exposing around 100,000 residents to elevated lead levels.
    contaminants:
      - preferred_term: lead
        term:
          id: CHEBI:25016
          label: lead atom
        evidence:
          - reference: PMID:26691115
            reference_title: 'Elevated Blood Lead Levels in Children Associated With the Flint Drinking Water Crisis: A Spatial Analysis of Risk and Public Health Response.'
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: introduced a more corrosive water source into an aging water system without adequate corrosion control.
    affected_facilities:
      - Flint Water Treatment Plant
    advisories:
      - advisory_kind: EMERGENCY_DECLARATION
        issued_by: Governor of Michigan
        start_date: '2016-01-05'
        description: A state of emergency in Genesee County, which contains Flint.
        evidence:
          - reference: WIKIPEDIA:Flint_water_crisis
            reference_title: Flint water crisis
            supports: SUPPORT
            evidence_source: ENCYCLOPEDIA
            snippet: On January 5, 2016, Michigan Governor Rick Snyder declared a state of emergency in Genesee County
      - advisory_kind: EMERGENCY_DECLARATION
        issued_by: US Environmental Protection Agency
        start_date: 2016-01
        end_date: '2025-05-19'
        description: An emergency order under the Safe Drinking Water Act, lifted once Flint met its requirements.
        evidence:
          - reference: url:https://www.epa.gov/newsreleases/epa-lifts-2016-emergency-order-drinking-water-flint-michigan
            reference_title: EPA Lifts 2016 Emergency Order on Drinking Water in Flint, Michigan | US EPA
            supports: SUPPORT
            evidence_source: GOVERNMENT_RECORD
            snippet: Since EPA issued the emergency order in January 2016
          - reference: url:https://www.epa.gov/flint
            reference_title: Flint | US EPA
            supports: SUPPORT
            evidence_source: GOVERNMENT_RECORD
            snippet: On May 19, 2025, EPA Administrator Zeldin announced the City of Flint has completed all requirements of EPA’s Safe Drinking Water Act emergency order and it will now be lifted.
    evidence:
      - reference: WIKIPEDIA:Flint_water_crisis
        reference_title: Flint water crisis
        supports: SUPPORT
        evidence_source: ENCYCLOPEDIA
        snippet: The Flint water crisis was a public health crisis from 2014 to 2019 which involved the drinking water for the city of Flint, Michigan, being contaminated with lead and possibly Legionella bacteria.
      - reference: PMID:26691115
        reference_title: 'Elevated Blood Lead Levels in Children Associated With the Flint Drinking Water Crisis: A Spatial Analysis of Risk and Public Health Response.'
        supports: SUPPORT
        evidence_source: PUBLICATION
        snippet: Incidence of elevated blood lead levels increased from 2.4% to 4.9% (P < .05) after water source change
      - reference: url:https://www.epa.gov/newsreleases/epa-lifts-2016-emergency-order-drinking-water-flint-michigan
        reference_title: EPA Lifts 2016 Emergency Order on Drinking Water in Flint, Michigan | US EPA
        supports: SUPPORT
        evidence_source: GOVERNMENT_RECORD
        snippet: the city has replaced over 97% of legacy lead pipes carrying water to homes, known as lead service lines.
  - name: Flint boil-water advisories of 2014
    incident_kind: TREATMENT_FAILURE
    start_date: 2014-08
    description: Coliform bacteria were detected in Flint's water twice, and residents were told to boil it.
    affected_facilities:
      - Flint Water Treatment Plant
    advisories:
      - advisory_kind: BOIL_WATER
        issued_by: City of Flint
        start_date: 2014-08
        end_date: '2014-08-20'
        evidence:
          - reference: WIKIPEDIA:Flint_water_crisis
            reference_title: Flint water crisis
            supports: SUPPORT
            evidence_source: ENCYCLOPEDIA
            snippet: The advisory is lifted on August 20. A second warning is issued in September.
            explanation: The timeline entry for August 14, 2014.
      - advisory_kind: BOIL_WATER
        issued_by: City of Flint
        start_date: 2014-09
        evidence:
          - reference: WIKIPEDIA:Flint_water_crisis
            reference_title: Flint water crisis
            supports: SUPPORT
            evidence_source: ENCYCLOPEDIA
            snippet: The advisory is lifted on August 20. A second warning is issued in September.
    evidence:
      - reference: WIKIPEDIA:Flint_water_crisis
        reference_title: Flint water crisis
        supports: SUPPORT
        evidence_source: ENCYCLOPEDIA
        snippet: In August and September 2014, city officials detected high levels of coliform bacteria, so residents were advised to boil their water.
  - name: Genesee County Legionnaires' disease outbreak
    incident_kind: OUTBREAK
    start_date: 2014-06
    end_date: 2015-11
    description: 87 cases of Legionnaires' disease and 12 deaths in Genesee County during the Flint water crisis.
    cause: Legionella proliferated through the Flint water system after the change of source.
    organisms:
      - preferred_term: Legionella pneumophila
        term:
          id: NCBITaxon:446
          label: Legionella pneumophila
        evidence:
          - reference: PMID:31625848
            reference_title: Comparison of Whole-Genome Sequences of Legionella pneumophila in Tap Water and in Clinical Strains, Flint, Michigan, USA, 2016.
            supports: SUPPORT
            evidence_source: PUBLICATION
            snippet: We compared whole-genome sequences of 10 clinical Legionella pneumophila isolates submitted to a laboratory in Genesee County during the second outbreak with 103 water isolates collected the following year.
    affected_facilities:
      - Flint Water Treatment Plant
    evidence:
      - reference: WIKIPEDIA:Flint_water_crisis
        reference_title: Flint water crisis
        supports: SUPPORT
        evidence_source: ENCYCLOPEDIA
        snippet: 87 cases of Legionnaires' disease, a waterborne disease, were reported in Genesee County from June 2014 – November 2015, resulting in 12 deaths
      - reference: PMID:29432149
        reference_title: Assessment of the Legionnaires' disease outbreak in Flint, Michigan.
        supports: SUPPORT
        evidence_source: PUBLICATION
        snippet: Following the switch in water supply from Detroit to Flint River water, the odds of a Flint resident presenting with LD increased 6.3-fold
      - reference: PMID:29432149
        reference_title: Assessment of the Legionnaires' disease outbreak in Flint, Michigan.
        supports: SUPPORT
        evidence_source: PUBLICATION
        snippet: the results support the hypothesis that a system-wide proliferation of legionellae was responsible for the LD outbreak in Genesee County, MI.
  - name: Flint trihalomethane violation
    incident_kind: TREATMENT_FAILURE
    start_date: '2014'
    description: Chlorine added to Flint's water in 2014 raised trihalomethanes, disinfection byproducts, past the limit; residents were told in January 2015.
    contaminants:
      - preferred_term: trihalomethanes
        term:
          id: CHEBI:760803
          label: trihalomethane
        evidence:
          - reference: WIKIPEDIA:Flint_water_crisis
            reference_title: Flint water crisis
            supports: SUPPORT
            evidence_source: ENCYCLOPEDIA
            snippet: This is likely the cause of a spike in trihalomethanes, unsafe chlorine byproducts, in one of eight water locations.
    affected_facilities:
      - Flint Water Treatment Plant
    evidence:
      - reference: WIKIPEDIA:Flint_water_crisis
        reference_title: Flint water crisis
        supports: SUPPORT
        evidence_source: ENCYCLOPEDIA
        snippet: Following this test, the MDEQ placed Flint on violation notice but did not reveal the information to residents until January 2015.
