# How `just export` writes KGX (formats kgx and kgx_maximal in
# conf/export.yaml). See src/datmech/kgx.py.
#
# kgx: one edge per term a record's section binds, from the record to the
#   term, with the section's predicate. Evidence goes on the edge:
#   references in `publications`, quotes in `supporting_text`.
# kgx_maximal: every object in a record is a node (datmech:<Class>),
#   every field holding objects an edge (datmech:<field>); records
#   and term nodes also take the categories below.
#
# biolink: true maps the graph onto the Biolink model. Every biolink:
# category and predicate is checked against it (the biolink-model package),
# and a predicate whose Biolink domain or range does not fit the categories
# is reported as a warning. Start from biolink:related_to, and choose a more
# specific predicate only where its meaning holds for every record: the
# design-mech-schema skill in mechmaker says how.
# biolink: false is for a domain Biolink does not cover. Categories and
# predicates are then the Mech's own CURIEs, and nothing checks them
# against a model.
biolink: true

# The category of a record.
record_category: biolink:NamedThing

# Provenance on every edge. knowledge_level and agent_type take Biolink's
# values, which KGX uses with or without the rest of Biolink.
knowledge_source: infores:datmech
knowledge_level: knowledge_assertion
agent_type: manual_validation_of_automated_agent

# Record sections whose items bind an ontology term: the predicate from the
# record to the term, the term's category, and the item's field that holds
# the term (default `term`; an item that is itself a term needs none).
sections:
  chemical_entities:
    predicate: biolink:related_to
    category: biolink:ChemicalEntity
  organisms:
    predicate: biolink:related_to
    category: biolink:OrganismTaxon
  environments:
    predicate: biolink:related_to
    category: biolink:EnvironmentalFeature
