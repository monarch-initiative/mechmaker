    evidence:
      - reference: WIKIPEDIA:Saanen_goat
        reference_title: Saanen goat
        supports: SUPPORT
        evidence_source: ENCYCLOPEDIA
        snippet: 'The Saanen originates in the historic region of Saanen (French: Comté de Gessenay) and in the neighbouring Simmental, both in the Bernese Oberland, in the southern part of the Canton of Bern, in western Switzerland.'
